      stopSampling();
      state.pendingCaptures.forEach(({ timerId }) => window.clearTimeout(timerId));
      if (state.recognitionActive && state.recognition) {
        state.recognition.abort();
      }
    });

    if (!window.isSecureContext) {
      showNotice("Microphone access may fail when this file is opened directly. Run it through localhost in Chrome or Edge if necessary.");
    }

    applyLanguageMode();
    applyTranslationToggle();
    resetSession();
    initialiseRecognition();

    // Try loading the translator immediately on launch. This only actually
    // succeeds without further interaction if the language pack was already
    // downloaded in an earlier session (no gesture needed for an already-
    // available model) — a first-time download still requires a click, per
    // browser policy, so the Start-button handler above retries this too.
    refreshTranslatedTargetPhrase();

    /* =====================================================================
       NOTEBOOK
       Captures feed directly into state.notes the moment completeCapture()
       runs — no export/import step. Connections, clusters, and prerequisites
       are computed from shared keywords, not hand-tagged. The "Ask AI to
       define" feature is the one part that costs anything: it's entirely
       opt-in (nothing fires until clicked) and needs your own Anthropic API
       key, kept only in this browser's localStorage — never written into
       this file, so the file itself is safe to share even after you've used
       the AI feature locally.
    ===================================================================== */

    const NB_STOPWORDS = new Set([
      "the", "and", "for", "with", "that", "this", "you", "your", "there", "their", "them",
      "then", "than", "these", "those", "were", "was", "have", "has", "had", "not", "but",
      "just", "really", "very", "like", "think", "going", "gonna", "get", "got", "one", "two",
      "also", "because", "what", "which", "who", "how", "does", "did", "can", "could", "would",
      "should", "will", "about", "all", "some", "more", "most", "much", "many", "even", "only",
      "out", "back", "here", "okay", "yeah", "from", "into", "every", "next", "part", "things",
      "make", "makes", "made", "need", "needs", "want", "wants", "says", "said", "concept",
      "concepts", "itself", "themselves", "yourself"
    ]);

    function nbTokenize(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean)
        .map((w) => (w.length > 4 ? w.replace(/s$/, "") : w))
        .filter((w) => w.length >= 4 && !NB_STOPWORDS.has(w));
    }

    // Everything written on a note — title, transcript, and the user's own
    // annotations at every depth — so annotations feed keywords, search,
    // clusters and connections just like the captured text does. Field
    // names ("Example", "Keyword", …) are only searchable, never keywords:
    // otherwise every two notes with an "Example" field would look related.
    function nbAnnotationText(annotations, includeLabels = true) {
      return (annotations || [])
        .map((a) => `${includeLabels ? a.label : ""} ${a.text} ${nbAnnotationText(a.children, includeLabels)}`)
        .join(" ");
    }

    function nbNoteText(note, includeLabels = true) {
      return `${note.concept} ${note.phrase} ${nbAnnotationText(note.annotations, includeLabels)}`;
    }

    // User keywords: the text of any annotation named "Keyword(s)" or
    // "Tag(s)", at any depth, split on commas/semicolons/new lines so one
    // field can hold several. Matched as whole phrases, case-insensitively,
    // so multi-word and Japanese keywords work too. In keyword sets they're
    // stored with a "#" prefix to keep them apart from automatic words.
    const NB_USER_KEYWORD_LABEL = /^(key ?words?|tags?)$/i;
    const NB_USER_KEYWORD_PREFIX = "#";
    // A keyword the user wrote on both notes counts this much toward their
    // link strength — enough on its own to meet the cluster threshold (2).
    const NB_USER_KEYWORD_WEIGHT = 2;

    function nbIsKeywordAnnotation(annotation) {
      return NB_USER_KEYWORD_LABEL.test(annotation.label.trim());
    }

    function nbUserKeywords(annotations, found = new Set()) {
      (annotations || []).forEach((a) => {
        if (nbIsKeywordAnnotation(a)) {
          a.text.split(/[,，、;；\n]+/)
            .map((keyword) => normaliseWhitespace(keyword).toLocaleLowerCase())
            .filter(Boolean)
            .forEach((keyword) => found.add(keyword));
        }
        nbUserKeywords(a.children, found);
      });
      return found;
    }

    function nbIsUserKeyword(word) {
      return word.startsWith(NB_USER_KEYWORD_PREFIX);
    }

    function nbKeywordSet(note) {
      const words = new Set(nbTokenize(nbNoteText(note, false)));
      nbUserKeywords(note.annotations).forEach((keyword) => words.add(`${NB_USER_KEYWORD_PREFIX}${keyword}`));
      return words;
    }

    // What two notes have in common, user keywords first. Automatic words
    // that are only part of a shared user keyword ("cost" inside
    // "#opportunity cost") are dropped, so they aren't listed or counted twice.
    function nbSharedWords(aWords, bWords) {
      const shared = [...aWords].filter((w) => bWords.has(w));
      const userKeywords = shared.filter(nbIsUserKeyword);
      const covered = new Set(userKeywords.flatMap((k) => nbTokenize(k.slice(NB_USER_KEYWORD_PREFIX.length))));
      return [...userKeywords, ...shared.filter((w) => !nbIsUserKeyword(w) && !covered.has(w))];
    }

    function nbLinkStrength(sharedWords) {
      return sharedWords.reduce((sum, w) => sum + (nbIsUserKeyword(w) ? NB_USER_KEYWORD_WEIGHT : 1), 0);
    }

    function nbComputeClusters(notes, sharedCounts, threshold) {
      const parent = {};
      notes.forEach((n) => (parent[n.id] = n.id));
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const union = (a, b) => {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent[ra] = rb;
      };
      notes.forEach((a) => notes.forEach((b) => {
        if (a.id < b.id && (sharedCounts[a.id][b.id] || 0) >= threshold) union(a.id, b.id);
      }));
      const groups = {};
      notes.forEach((n) => {
        const root = find(n.id);
        (groups[root] = groups[root] || []).push(n);
      });
      return Object.values(groups);
    }

    // Clusters are the AI's topics once "Refine with AI" has assigned any:
    // notes with the same topic (ignoring case) form one cluster, and a note
    // without a topic yet (captured since the last refine) stands alone
    // until the next refine. Before any refine, clusters come from chaining
    // notes whose link strength is at least 2.
    function nbClusterNotes(notes, sharedCounts) {
      if (!notes.some((n) => n.topic)) return nbComputeClusters(notes, sharedCounts, 2);
      const groups = new Map();
      notes.forEach((n) => {
        const key = n.topic ? `topic:${n.topic.toLocaleLowerCase()}` : `note:${n.id}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(n);
      });
      return [...groups.values()];
    }

    function nbClusterLabel(group, keywordSets) {
      if (group[0].topic) return group[0].topic;
      const freq = {};
      group.forEach((n) => keywordSets[n.id].forEach((w) => (freq[w] = (freq[w] || 0) + 1)));
      const common = Object.entries(freq).filter(([, c]) => c >= 2);
      // Keywords the user wrote name the cluster when there are any.
      const userCommon = common.filter(([w]) => nbIsUserKeyword(w));
      const top = (userCommon.length ? userCommon : common)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 2)
        .map(([w]) => w);
      return top.length ? top.join(" · ") : group[0].concept;
    }

    const NB_CLUSTER_PALETTE = ["#ffb454", "#70b7ff", "#7ee0a8", "#c8a2ff", "#ff9ecf", "#ffd166"];
    const NB_UNCLUSTERED_COLOR = "#5b6570";

    // Key terms are a note's own keywords (its Keyword/Tag annotations, the
    // user's and the AI's). Definitions are written by the AI for that
    // specific note and kept on it as note.termDefinitions: [{ term,
    // definition }], so they're saved with the notebook. A definition stays
    // attached to its term even if the keyword is later removed, and shows
    // again if the keyword comes back.
    function nbTermDefinition(note, term) {
      const key = term.toLocaleLowerCase();
      return (note.termDefinitions || []).find((d) => d.term.toLocaleLowerCase() === key)?.definition || "";
    }

    function nbSetTermDefinitions(note, definitions) {
      const incoming = definitions
        .map((d) => ({ term: normaliseWhitespace(d.term), definition: normaliseWhitespace(d.definition) }))
        .filter((d) => d.term && d.definition);
      const replaced = new Set(incoming.map((d) => d.term.toLocaleLowerCase()));
      note.termDefinitions = [
        ...(note.termDefinitions || []).filter((d) => !replaced.has(d.term.toLocaleLowerCase())),
        ...incoming
      ];
    }

    function nbFormatElapsed(seconds) {
      const s = Math.max(0, Math.round(seconds));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    // Placeholder notes shown until the first real capture arrives — real
    // timestamps from a Microeconomics 101 session, just so every view has
    // something to demonstrate on first load. Replaced entirely (not merged)
    // the moment a real capture completes.
    const SAMPLE_NOTES = [
      { id: "s1", timeLabel: "0:00", elapsedS: 0, concept: "Scarcity & trade-offs", phrase: "the study of how individuals and firms make themselves as well off as possible in a world of scarcity" },
      { id: "s2", timeLabel: "0:20", elapsedS: 20, concept: "Constrained optimization", phrase: "the core of microeconomics is constrained optimization" },
      { id: "s3", timeLabel: "0:26", elapsedS: 26, concept: "Trade-offs in decisions", phrase: "individuals and firms assess the trade-offs they face every day, then decide the best option given those trade-offs" },
      { id: "s4", timeLabel: "1:00", elapsedS: 60, concept: "Opportunity cost", phrase: "one of the most important concepts in economics is the concept of opportunity cost" },
      { id: "s5", timeLabel: "1:22", elapsedS: 82, concept: "Cost of every action", phrase: "every action has costs in terms of what you could have done instead — the next best opportunity" },
      { id: "s6", timeLabel: "1:47", elapsedS: 107, concept: "Every action is a trade-off", phrase: "every action you take is a trade-off — every decision involves one because there's always an opportunity cost" },
      { id: "s7", timeLabel: "2:36", elapsedS: 156, concept: "What is a model", phrase: "a model is the description of a relationship between two or more variables" },
      { id: "s8", timeLabel: "2:52", elapsedS: 172, concept: "Economics as a social science", phrase: "economics is not a real science — it's a social science, so we don't have rigid, universally applicable laws" },
      { id: "s9", timeLabel: "3:15", elapsedS: 195, concept: "Simplifying assumptions", phrase: "simplifying assumptions trade off two goals — explaining as much as we can, and having parsimonious models that are easy to teach" },
      { id: "s10", timeLabel: "3:46", elapsedS: 226, concept: "Two goods, easier math", phrase: "everything you learn in a model with 2 goods tells you what you need for more goods — just with easier math" },
      { id: "s11", timeLabel: "4:01", elapsedS: 241, concept: "Noxious assumptions", phrase: "we'll make other simplifying assumptions which are noxious and offensive" },
      { id: "s12", timeLabel: "4:27", elapsedS: 267, concept: "Supply and demand (Adam Smith)", phrase: "the first economic model, developed by Adam Smith in 1776 in The Wealth of Nations" },
      { id: "s13", timeLabel: "4:56", elapsedS: 296, concept: "Water–diamond paradox", phrase: "water is essential to life and diamonds aren't, yet diamonds are expensive and water is essentially free" },
      { id: "s14", timeLabel: "5:54", elapsedS: 354, concept: "Price needs both sides", phrase: "you can't just think of supply and demand in isolation — you need to think of them together" }
    ];

    // Fresh copies, so editing a sample note never mutates SAMPLE_NOTES.
    state.notes = SAMPLE_NOTES.map((n) => ({ ...n, originalPhrase: n.phrase, annotations: [] }));
    state.usingSampleNotes = true;

    function addNoteFromCapture(capture, pending) {
      if (state.usingSampleNotes) {
        state.notes = [];
        state.usingSampleNotes = false;
      }
      const elapsedS = state.nbSessionOffsetS + (state.sessionStartPerfMs
        ? (pending.pressPerfMs - state.sessionStartPerfMs) / 1000
        : 0);
      // Numbering continues from the notebook's highest capture, so notes
      // added in a later session never reuse an id.
      const number = 1 + Math.max(0, ...state.notes.map((n) => Number(/^c(\d+)$/.exec(n.id)?.[1]) || 0));
      const phrase = capture.adjustedPhrase || capture.rawPhrase || "(no caption text was visible)";
      // Sentence context comes from the same snapshot the phrase did. It's
      // fixed metadata — kept even if the phrase is edited — and is sent
      // along when the note is refined with AI.
      const usedAdjusted = Boolean(capture.adjustedPhrase);
      state.notes.push({
        previousSentence: usedAdjusted ? capture.adjustedPreviousSentence : capture.rawPreviousSentence,
        currentSentence: usedAdjusted ? capture.adjustedCurrentSentence : capture.rawCurrentSentence,
        id: `c${number}`,
        capturedAt: new Date().toISOString(),
        timeLabel: nbFormatElapsed(elapsedS),
        elapsedS,
        concept: `Capture ${number}`,
        phrase,
        originalPhrase: phrase,
        annotations: [],
        pane: capture.pane,
        targetPhrase: capture.targetPhrase,
        rawContainsTarget: capture.rawContainsTarget,
        adjustedContainsTarget: capture.adjustedContainsTarget,
        // The full capture record (raw vs delay-adjusted text, both sentence
        // contexts, timing), kept with the note so it survives saving and
        // reopening. `session` matches the interaction log's session id.
        capture: { ...capture, session: LOG_SESSION_ID }
      });
    }

    /* ---------- AI-judged links ----------
       "Refine with AI" gives each note aiLinks: [{ id, strength 1–3,
       reason }] — the other notes it judged related, and how. A pair of
       notes that have both been refined is linked only by that judgement
       (either direction counts, the stronger wins). A pair where either
       note is newer than the last refine falls back to word overlap until
       the next refine, so fresh captures aren't left unconnected. */
    // AI strength 1/2/3 on the same scale as word-overlap link strength.
    const NB_AI_LINK_STRENGTH = { 1: 1, 2: 3, 3: 5 };

    function nbIsAiJudged(a, b) {
      return Array.isArray(a.aiLinks) && Array.isArray(b.aiLinks);
    }

    function nbAiLink(a, b) {
      const candidates = [
        a.aiLinks.find((l) => l.id === b.id),
        b.aiLinks.find((l) => l.id === a.id)
      ].filter(Boolean);
      return candidates.sort((x, y) => y.strength - x.strength)[0] || null;
    }

    // Why two notes are linked, for hover text and related-note rows.
    function nbLinkWhy(a, b, keywordSets) {
      if (nbIsAiJudged(a, b)) return nbAiLink(a, b)?.reason || "";
      return `shares: ${nbSharedWords(keywordSets[a.id], keywordSets[b.id]).join(", ")}`;
    }

    function nbBuildGraph(notes) {
      const keywordSets = {};
      notes.forEach((n) => (keywordSets[n.id] = nbKeywordSet(n)));
      // sharedCounts holds link strength, not a raw count: an AI-judged
      // link maps through NB_AI_LINK_STRENGTH; otherwise a shared user
      // keyword weighs NB_USER_KEYWORD_WEIGHT and a shared automatic word 1.
      const sharedCounts = {};
      notes.forEach((a) => {
        sharedCounts[a.id] = {};
        notes.forEach((b) => {
          if (a.id === b.id) return;
          sharedCounts[a.id][b.id] = nbIsAiJudged(a, b)
            ? NB_AI_LINK_STRENGTH[nbAiLink(a, b)?.strength] || 0
            : nbLinkStrength(nbSharedWords(keywordSets[a.id], keywordSets[b.id]));
        });
      });
      return { keywordSets, sharedCounts };
    }

    function nbNeighborsOf(id, notes, sharedCounts, keywordSets) {
      const n0 = notes.find((n) => n.id === id);
      return notes
        .filter((n) => n.id !== id)
        .map((n) => ({ node: n, shared: sharedCounts[id][n.id], why: nbLinkWhy(n0, n, keywordSets) }))
        .filter((x) => x.shared >= 1)
        .sort((a, b) => b.shared - a.shared)
        .slice(0, 6);
    }

    function nbBuildsOnOf(id, notes, sharedCounts, keywordSets) {
      const n0 = notes.find((n) => n.id === id);
      return notes
        .filter((n) => n.id !== id && n.elapsedS < n0.elapsedS)
        .map((n) => ({ node: n, shared: sharedCounts[id][n.id], why: nbLinkWhy(n0, n, keywordSets) }))
        .filter((x) => x.shared >= 1)
        .sort((a, b) => b.shared - a.shared)
        .slice(0, 4);
    }

    // Selecting a note from anywhere in the notebook; `via` records which
    // control was used (chip, timeline dot, connections node, related row).
    function nbSelectNote(noteId, via) {
      if (noteId !== state.selectedNoteId) {
        logEvent("note_selected", { noteId, via, view: state.notebookView });
      }
      state.selectedNoteId = noteId;
      renderNotebook();
    }

    function nbMatches(note, query) {
      if (!query.trim()) return true;
      return nbNoteText(note).toLowerCase().includes(query.toLowerCase());
    }

    function nbChip(note, opts = {}) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nb-chip" + (note.id === state.selectedNoteId ? " active" : "");
      if (opts.dim) btn.style.opacity = "0.35";
      const color = opts.color || "#5b6570";
      const dot = document.createElement("span");
      dot.className = "nb-chip-dot";
      dot.style.background = color;
      const time = document.createElement("span");
      time.className = "nb-chip-time";
      time.textContent = note.timeLabel;
      const concept = document.createElement("div");
      concept.className = "nb-chip-concept";
      concept.textContent = note.concept;
      btn.append(dot, time, concept);
      btn.addEventListener("click", () => nbSelectNote(note.id, "chip"));
      return btn;
    }

    // includeDetail: false refreshes the views but leaves the detail panel's
    // fields alone (only its Related notes list is refreshed) — used after an
    // edit is committed there, so the field being typed in isn't torn down
    // and doesn't lose focus.
    function renderNotebook({ includeDetail = true } = {}) {
      const notes = state.notes;

      elements.nbDownloadButton.disabled = state.usingSampleNotes || notes.length === 0;

      if ((!state.selectedNoteId || !notes.some((n) => n.id === state.selectedNoteId)) && notes.length > 0) {
        state.selectedNoteId = notes[0].id;
      }

      elements.nbContent.replaceChildren();

      if (notes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "nb-empty";
        empty.textContent = "No notes yet — press Space on the Capture screen while recognition is running to add one, or open a saved notebook.";
        elements.nbContent.appendChild(empty);
        elements.nbDetail.replaceChildren();
        return;
      }

      const { keywordSets, sharedCounts } = nbBuildGraph(notes);
      const rawClusters = nbClusterNotes(notes, sharedCounts);
      const clusterGroups = rawClusters.filter((g) => g.length > 1).sort((a, b) => b.length - a.length);
      const singles = rawClusters.filter((g) => g.length === 1).map((g) => g[0]);
      const nodeColor = {};
      clusterGroups.forEach((g, i) => {
        const color = NB_CLUSTER_PALETTE[i % NB_CLUSTER_PALETTE.length];
        g.forEach((n) => (nodeColor[n.id] = color));
      });
      singles.forEach((n) => (nodeColor[n.id] = NB_UNCLUSTERED_COLOR));

      const view = state.notebookView;
      if (view === "list") renderNbList(notes, nodeColor);
      else if (view === "chrono") renderNbChrono(notes, nodeColor);
      else if (view === "density") renderNbDensity(notes, nodeColor);
      else if (view === "clusters") renderNbClusters(clusterGroups, singles, keywordSets, nodeColor);
      else if (view === "connections") renderNbConnections(notes, sharedCounts, keywordSets, nodeColor);
      else if (view === "breakdown") renderNbBreakdown(notes, sharedCounts, keywordSets);

      if (includeDetail) {
        renderNbDetail(notes, sharedCounts, keywordSets);
      } else {
        const selected = notes.find((n) => n.id === state.selectedNoteId);
        const related = document.getElementById("nbRelated");
        if (selected && related) renderNbRelated(related, selected, notes, sharedCounts, keywordSets);
      }
    }

    function renderNbList(notes, nodeColor) {
      const grid = document.createElement("div");
      grid.className = "nb-chip-grid";
      notes.forEach((n) => grid.appendChild(nbChip(n, { color: nodeColor[n.id], dim: !nbMatches(n, state.notebookQuery) })));
      elements.nbContent.appendChild(grid);
    }

    function renderNbChrono(notes, nodeColor) {
      const maxElapsed = Math.max(60, ...notes.map((n) => n.elapsedS)) * 1.05;
      const wrap = document.createElement("div");

      const timeline = document.createElement("div");
      timeline.className = "nb-timeline";
      const track = document.createElement("div");
      track.className = "nb-timeline-track";
      timeline.appendChild(track);

      const tickCount = 6;
      for (let i = 0; i <= tickCount; i += 1) {
        const frac = i / tickCount;
        const tick = document.createElement("div");
        tick.className = "nb-timeline-tick";
        tick.style.left = `${frac * 100}%`;
        const label = document.createElement("span");
        label.textContent = nbFormatElapsed(frac * maxElapsed);
        tick.appendChild(label);
        timeline.appendChild(tick);
      }

      notes.forEach((n) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "nb-timeline-dot" + (n.id === state.selectedNoteId ? " selected" : "");
        dot.title = `${n.timeLabel} — ${n.concept}`;
        dot.style.left = `${(n.elapsedS / maxElapsed) * 100}%`;
        dot.style.background = nodeColor[n.id] || "var(--accent)";
        dot.style.opacity = nbMatches(n, state.notebookQuery) ? "1" : "0.25";
        dot.addEventListener("click", () => nbSelectNote(n.id, "timeline_dot"));
        timeline.appendChild(dot);
      });

      wrap.appendChild(timeline);
      elements.nbContent.appendChild(wrap);
    }

    function renderNbDensity(notes, nodeColor) {
      const binSize = 30;
      const maxElapsed = Math.max(60, ...notes.map((n) => n.elapsedS));
      const binCount = Math.ceil(maxElapsed / binSize) + 1;
      const bins = Array.from({ length: binCount }, (_, i) => ({ i, start: i * binSize, notes: [] }));
      notes.forEach((n) => {
        const idx = Math.min(binCount - 1, Math.floor(n.elapsedS / binSize));
        bins[idx].notes.push(n);
      });
      const maxCount = Math.max(1, ...bins.map((b) => b.notes.length));

      const wrap = document.createElement("div");
      const info = document.createElement("div");
      info.style.cssText = "font-size:0.8rem;color:var(--muted);margin-bottom:10px;";
      info.textContent = `Notes grouped into ${binSize}s windows — darker means more was captured in that stretch. Click a bar to see what's in it.`;
      wrap.appendChild(info);

      const barsWrap = document.createElement("div");
      barsWrap.className = "nb-density-bars";
      bins.forEach((b) => {
        const bar = document.createElement("button");
        bar.type = "button";
        bar.className = "nb-density-bar" + (state.nbActiveBin === b.i ? " active" : "");
        const intensity = b.notes.length / maxCount;
        if (b.notes.length) {
          const alpha = Math.round((0.25 + intensity * 0.75) * 255).toString(16).padStart(2, "0");
          bar.style.background = `#70b7ff${alpha}`;
        }
        bar.title = `${nbFormatElapsed(b.start)}–${nbFormatElapsed(b.start + binSize)}: ${b.notes.length} note(s)`;
        bar.addEventListener("click", () => {
          state.nbActiveBin = state.nbActiveBin === b.i ? null : b.i;
          logEvent("density_bin_toggled", { bin: b.i, startS: b.start, notes: b.notes.length, selected: state.nbActiveBin === b.i });
          renderNotebook();
        });
        barsWrap.appendChild(bar);
      });
      wrap.appendChild(barsWrap);

      const busiest = bins.reduce((a, b) => (b.notes.length > a.notes.length ? b : a), bins[0]);
      const busiestLine = document.createElement("div");
      busiestLine.style.cssText = "font-size:0.76rem;color:var(--muted);margin-bottom:8px;";
      busiestLine.textContent = `Busiest stretch: ${nbFormatElapsed(busiest.start)}–${nbFormatElapsed(busiest.start + binSize)} (${busiest.notes.length} notes)`;
      wrap.appendChild(busiestLine);

      if (state.nbActiveBin !== null && bins[state.nbActiveBin]) {
        const bin = bins[state.nbActiveBin];
        const label = document.createElement("div");
        label.style.cssText = "font-size:0.78rem;color:var(--muted);margin:12px 0 6px;";
        label.textContent = `${nbFormatElapsed(bin.start)}–${nbFormatElapsed(bin.start + binSize)}`;
        wrap.appendChild(label);
        const grid = document.createElement("div");
        grid.className = "nb-chip-grid";
        if (bin.notes.length === 0) {
          const empty = document.createElement("div");
          empty.className = "nb-empty";
          empty.textContent = "Nothing captured in this window.";
          wrap.appendChild(empty);
        } else {
          bin.notes.forEach((n) => grid.appendChild(nbChip(n, { color: nodeColor[n.id] })));
          wrap.appendChild(grid);
        }
      }

      elements.nbContent.appendChild(wrap);
    }

    function renderNbClusters(clusterGroups, singles, keywordSets, nodeColor) {
      const wrap = document.createElement("div");
      const grid = document.createElement("div");
      grid.className = "nb-cluster-grid";

      clusterGroups.forEach((group, i) => {
        const color = NB_CLUSTER_PALETTE[i % NB_CLUSTER_PALETTE.length];
        const card = document.createElement("div");
        card.className = "nb-cluster-card";
        card.style.border = `1px solid ${color}66`;

        const head = document.createElement("div");
        head.style.cssText = "display:flex;justify-content:space-between;margin-bottom:8px;";
        const label = document.createElement("span");
        label.style.cssText = `color:${color};font-weight:750;font-size:0.8rem;`;
        label.textContent = nbClusterLabel(group, keywordSets);
        const count = document.createElement("span");
        count.style.cssText = "color:var(--muted);font-size:0.75rem;";
        count.textContent = `${group.length} notes`;
        head.append(label, count);
        card.appendChild(head);

        const chipGrid = document.createElement("div");
        chipGrid.className = "nb-chip-grid";
        group.forEach((n) => chipGrid.appendChild(nbChip(n, { color })));
        card.appendChild(chipGrid);

        grid.appendChild(card);
      });
      wrap.appendChild(grid);

      if (singles.length > 0) {
        const card = document.createElement("div");
        card.className = "nb-cluster-card";
        card.style.cssText = "border:1px dashed var(--border);margin-top:12px;";
        const head = document.createElement("div");
        head.style.cssText = "display:flex;justify-content:space-between;margin-bottom:8px;";
        head.innerHTML = `<span style="color:var(--muted);font-weight:750;font-size:0.75rem;">UNCLUSTERED — not grouped with any other note yet</span><span style="color:var(--muted);font-size:0.75rem;">${singles.length} notes</span>`;
        card.appendChild(head);
        const chipGrid = document.createElement("div");
        chipGrid.className = "nb-chip-grid";
        singles.forEach((n) => chipGrid.appendChild(nbChip(n, { color: NB_UNCLUSTERED_COLOR })));
        card.appendChild(chipGrid);
        wrap.appendChild(card);
      }

      elements.nbContent.appendChild(wrap);
    }

    // Line weight for a link of the given strength. Capped: user keywords
    // push link strength well past a few shared words.
    const NB_LINK_STRENGTH_CAP = 5;

    function nbLinkStroke(shared) {
      const strength = Math.min(shared, NB_LINK_STRENGTH_CAP);
      return { width: 0.6 + strength * 0.5, opacity: 0.35 + strength * 0.12 };
    }

    // A dark fill tinted with a cluster colour, for nodes that show their
    // cluster without competing with the solid-filled selected note.
    function nbClusterTint(color) {
      return `color-mix(in srgb, ${color} 22%, #0d1218)`;
    }

    // The same three-item key for every note: solid = selected, ringed =
    // connected, line weight = link strength. Swatches use the selected
    // note's actual cluster colour.
    function nbConnectionsLegend(selectedColor) {
      const legend = document.createElement("div");
      legend.className = "nb-legend";

      const heading = document.createElement("div");
      heading.className = "nb-breakdown-label";
      heading.textContent = "How to read this";
      legend.appendChild(heading);

      const item = (swatch, text) => {
        const row = document.createElement("div");
        row.className = "nb-legend-item";
        const label = document.createElement("span");
        label.textContent = text;
        row.append(swatch, label);
        legend.appendChild(row);
      };
      const dot = (fill, ring) => {
        const el = document.createElement("span");
        el.className = "nb-legend-dot";
        el.style.background = fill;
        el.style.borderColor = ring;
        return el;
      };

      item(dot(selectedColor, selectedColor), "Solid circle — the selected note.");
      item(dot(nbClusterTint(selectedColor), selectedColor), "Ringed circle — a connected note. Colours match the Clusters tab.");

      // Line thickness: sample lines at weak, medium and strongest.
      const svgNS = "http://www.w3.org/2000/svg";
      const samples = document.createElementNS(svgNS, "svg");
      samples.setAttribute("viewBox", "0 0 30 16");
      samples.setAttribute("class", "nb-legend-lines");
      samples.setAttribute("aria-hidden", "true");
      [1, 3, NB_LINK_STRENGTH_CAP].forEach((shared, i) => {
        const { width, opacity } = nbLinkStroke(shared);
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", 1);
        line.setAttribute("x2", 29);
        line.setAttribute("y1", 2.5 + i * 5.5);
        line.setAttribute("y2", 2.5 + i * 5.5);
        line.setAttribute("stroke", "currentColor");
        line.setAttribute("stroke-width", width);
        line.setAttribute("opacity", opacity);
        samples.appendChild(line);
      });
      item(samples, "Line thickness — how strongly the two notes are related.");

      return legend;
    }

    function renderNbConnections(notes, sharedCounts, keywordSets, nodeColor) {
      const wrap = document.createElement("div");
      const picker = document.createElement("div");
      picker.className = "nb-chip-grid";
      picker.style.marginBottom = "20px";
      notes.forEach((n) => picker.appendChild(nbChip(n, { color: nodeColor[n.id] })));
      wrap.appendChild(picker);

      const selected = notes.find((n) => n.id === state.selectedNoteId) || notes[0];
      const neighbors = nbNeighborsOf(selected.id, notes, sharedCounts, keywordSets);

      const ego = document.createElement("div");
      ego.className = "nb-ego";

      // Layered bottom to top: link lines, neighbour nodes, then the
      // selected note, so nothing is ever drawn over the centre.
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
      ego.appendChild(svg);

      neighbors.forEach((nb, i) => {
        const angle = (i / neighbors.length) * 2 * Math.PI - Math.PI / 2;
        const x = 50 + 38 * Math.cos(angle);
        const y = 50 + 38 * Math.sin(angle);

        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", 50);
        line.setAttribute("y1", 50);
        line.setAttribute("x2", x);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", nodeColor[nb.node.id] || "#5b6570");
        const { width, opacity } = nbLinkStroke(nb.shared);
        line.setAttribute("stroke-width", width);
        line.setAttribute("opacity", opacity);
        svg.appendChild(line);

        const node = document.createElement("button");
        node.type = "button";
        node.className = "nb-ego-node";
        node.style.left = `${x}%`;
        node.style.top = `${y}%`;
        const color = nodeColor[nb.node.id] || NB_UNCLUSTERED_COLOR;
        node.style.border = `2px solid ${color}`;
        node.style.background = nbClusterTint(color);
        node.title = nb.why;
        node.textContent = nb.node.concept;
        node.addEventListener("click", () => nbSelectNote(nb.node.id, "connections_node"));
        ego.appendChild(node);
      });

      // The selected note is filled with its own cluster's colour, so it
      // visibly belongs with same-coloured neighbours; differently coloured
      // neighbours are links into other clusters.
      const center = document.createElement("div");
      center.className = "nb-ego-center";
      center.textContent = selected.concept;
      const centerColor = nodeColor[selected.id] || NB_UNCLUSTERED_COLOR;
      center.style.background = centerColor;
      center.style.color = centerColor === NB_UNCLUSTERED_COLOR ? "var(--text)" : "#0b0f14";
      ego.appendChild(center);

      wrap.appendChild(ego);

      if (neighbors.length === 0) {
        const empty = document.createElement("div");
        empty.className = "nb-empty";
        empty.textContent = `No other note is connected to "${selected.concept}" yet.`;
        wrap.appendChild(empty);
      } else {
        wrap.appendChild(nbConnectionsLegend(centerColor));
        const list = document.createElement("div");
        list.style.cssText = "margin-top:16px;font-size:0.78rem;color:var(--muted);display:grid;gap:6px;";
        neighbors.forEach((nb) => {
          const row = document.createElement("div");
          row.textContent = `${selected.concept} ↔ ${nb.node.concept}${nb.why ? ` — ${nb.why}` : ""}`;
          list.appendChild(row);
        });
        wrap.appendChild(list);
      }

      elements.nbContent.appendChild(wrap);
    }

    function renderNbBreakdown(notes, sharedCounts, keywordSets) {
      const wrap = document.createElement("div");
      const picker = document.createElement("div");
      picker.className = "nb-chip-grid";
      picker.style.marginBottom = "16px";
      notes.forEach((n) => picker.appendChild(nbChip(n, {})));
      wrap.appendChild(picker);

      const selected = notes.find((n) => n.id === state.selectedNoteId) || notes[0];

      const title = document.createElement("div");
      title.style.cssText = "font-size:1.1rem;font-weight:700;margin-bottom:6px;";
      title.textContent = selected.concept;
      wrap.appendChild(title);

      const quote = document.createElement("div");
      quote.className = "nb-note-quote";
      quote.textContent = `"${selected.phrase}"`;
      wrap.appendChild(quote);

      const buildsOnSection = document.createElement("div");
      buildsOnSection.className = "nb-breakdown-section";
      const buildsOnLabel = document.createElement("div");
      buildsOnLabel.className = "nb-breakdown-label";
      buildsOnLabel.textContent = "Builds on — earlier notes this one leans on";
      buildsOnSection.appendChild(buildsOnLabel);

      const builtOn = nbBuildsOnOf(selected.id, notes, sharedCounts, keywordSets);
      if (builtOn.length === 0) {
        const p = document.createElement("div");
        p.className = "nb-empty";
        p.style.cssText = "padding:0;text-align:left;";
        p.textContent = "This is a starting concept — nothing earlier feeds into it.";
        buildsOnSection.appendChild(p);
      } else {
        builtOn.forEach((b) => {
          buildsOnSection.appendChild(nbRelatedRow(b.node, `${b.node.timeLabel} — ${b.node.concept}`, b.why));
        });
      }
      wrap.appendChild(buildsOnSection);

      const termsSection = document.createElement("div");
      termsSection.className = "nb-breakdown-section";
      const termsLabel = document.createElement("div");
      termsLabel.className = "nb-breakdown-label";
      termsLabel.textContent = "Key terms — this note's keywords";
      termsSection.appendChild(termsLabel);
      const terms = [...nbUserKeywords(selected.annotations)];

      if (terms.length === 0) {
        const p = document.createElement("div");
        p.className = "nb-empty";
        p.style.cssText = "padding:0;text-align:left;";
        p.textContent = "No keywords on this note yet — add a Keyword annotation in the details panel, or use Refine with AI to suggest some.";
        termsSection.appendChild(p);
      } else {
        terms.forEach((term) => {
          // Built from text nodes: terms are user-typed and definitions come
          // from the AI, so neither is ever parsed as HTML.
          const row = document.createElement("div");
          row.className = "nb-term-definition";
          const termEl = document.createElement("strong");
          termEl.textContent = term;
          const definition = nbTermDefinition(selected, term);
          const definitionEl = document.createElement("span");
          definitionEl.className = definition ? "nb-term-definition-text" : "nb-term-definition-text blank";
          definitionEl.textContent = definition || "Not defined yet";
          row.append(termEl, " — ", definitionEl);
          termsSection.appendChild(row);
        });
      }
      wrap.appendChild(termsSection);

      elements.nbContent.appendChild(wrap);
    }

    function renderNbDetail(notes, sharedCounts, keywordSets) {
      elements.nbDetail.replaceChildren();
      // Start a newly selected note at the top; re-renders of the same note keep their scroll.
      if (elements.nbDetail.dataset.noteId !== String(state.selectedNoteId)) {
        elements.nbDetail.scrollTop = 0;
        elements.nbDetail.dataset.noteId = String(state.selectedNoteId);
      }
      const selected = notes.find((n) => n.id === state.selectedNoteId);
      if (!selected) return;

      const time = document.createElement("div");
      time.style.cssText = "font-family:ui-monospace,monospace;font-size:0.78rem;color:var(--muted);margin-bottom:6px;";
      time.textContent = selected.timeLabel + (selected.pane ? ` · ${selected.pane}` : "");
      elements.nbDetail.appendChild(time);

      const title = document.createElement("input");
      title.type = "text";
      title.className = "nb-edit-field nb-edit-title";
      title.value = selected.concept;
      title.placeholder = "Untitled note";
      title.setAttribute("aria-label", "Note title");
      title.addEventListener("input", () => {
        selected.concept = title.value.trim() || "Untitled note";
      });
      title.addEventListener("change", () => {
        logEvent("note_title_edited", { noteId: selected.id, title: selected.concept });
        nbCommitEdit();
      });
      elements.nbDetail.appendChild(title);

      const transcriptLabel = document.createElement("div");
      transcriptLabel.className = "nb-breakdown-label nb-detail-label";
      transcriptLabel.textContent = "Captured text";
      elements.nbDetail.appendChild(transcriptLabel);

      const transcript = document.createElement("textarea");
      transcript.className = "nb-edit-field nb-note-quote";
      transcript.value = selected.phrase;
      transcript.setAttribute("aria-label", "Captured text — edit to correct it");
      const revert = document.createElement("button");
      revert.type = "button";
      revert.className = "nb-mini-button";
      revert.textContent = "Revert to captured text";
      revert.hidden = selected.phrase === selected.originalPhrase;
      transcript.addEventListener("input", () => {
        selected.phrase = transcript.value;
        revert.hidden = selected.phrase === selected.originalPhrase;
      });
      transcript.addEventListener("change", () => {
        logEvent("captured_text_edited", {
          noteId: selected.id,
          length: selected.phrase.length,
          originalLength: selected.originalPhrase.length,
          differsFromCapture: selected.phrase !== selected.originalPhrase
        });
        nbCommitEdit();
      });
      revert.addEventListener("click", () => {
        logEvent("captured_text_reverted", { noteId: selected.id });
        selected.phrase = selected.originalPhrase;
        renderNotebook();
      });
      elements.nbDetail.append(transcript, revert);

      // Sample notes have no sentence context, so the section only appears
      // for real captures.
      if (selected.currentSentence !== undefined) {
        const contextLabel = document.createElement("div");
        contextLabel.className = "nb-breakdown-label nb-detail-label";
        contextLabel.textContent = "Sentence context";
        const context = document.createElement("div");
        context.className = "nb-sentence-context";
        const makeContextLine = (label, sentenceText) => {
          const line = document.createElement("p");
          line.className = "context-line";
          const labelSpan = document.createElement("span");
          labelSpan.className = "context-label";
          labelSpan.textContent = `${label}: `;
          const textSpan = document.createElement("span");
          if (sentenceText) {
            textSpan.textContent = sentenceText;
          } else {
            textSpan.className = "blank";
            textSpan.textContent = "(none)";
          }
          line.append(labelSpan, textSpan);
          return line;
        };
        context.append(
          makeContextLine("Previous", selected.previousSentence),
          makeContextLine("Current", selected.currentSentence)
        );
        elements.nbDetail.append(contextLabel, context);
      }

      renderNbAnnotations(selected);

      const related = document.createElement("div");
      related.id = "nbRelated";
      elements.nbDetail.appendChild(related);
      renderNbRelated(related, selected, notes, sharedCounts, keywordSets);
    }

    // Kept in its own container so a committed edit (e.g. a new keyword) can
    // refresh the links here without rebuilding the fields being edited.
    function renderNbRelated(container, selected, notes, sharedCounts, keywordSets) {
      container.replaceChildren();

      const label = document.createElement("div");
      label.className = "nb-breakdown-label nb-detail-label";
      label.textContent = "Related notes";
      container.appendChild(label);

      const neighbors = nbNeighborsOf(selected.id, notes, sharedCounts, keywordSets);
      if (neighbors.length === 0) {
        const p = document.createElement("div");
        p.style.cssText = "font-size:0.78rem;color:var(--muted);";
        p.textContent = "Not connected to any other note yet.";
        container.appendChild(p);
      } else {
        neighbors.forEach((nb) => {
          container.appendChild(nbRelatedRow(nb.node, nb.node.concept, nb.why));
        });
      }
    }

    // A clickable link to another note. Built with textContent, since titles
    // and annotations are user-typed and must never be parsed as HTML.
    function nbRelatedRow(node, heading, why) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "nb-term-row";
      const text = document.createElement("span");
      const reason = document.createElement("span");
      reason.style.cssText = "color:var(--muted);font-family:ui-monospace,monospace;font-size:0.7rem;";
      reason.textContent = why;
      text.append(heading, document.createElement("br"), reason);
      row.appendChild(text);
      row.addEventListener("click", () => nbSelectNote(node.id, "related_row"));
      return row;
    }

    /* ---------- User annotations ----------
       Each note carries a tree of free-form annotations:
       { id, label, text, children }. The label is free text with a few
       suggestions (Keyword, Idea, Example, …), and any annotation can hold
       sub-items, so a user can build e.g. Example → Counter-example → Note.
       Typing updates state in place without re-rendering; committing a
       field (blur / Enter) refreshes the other views via nbCommitEdit, and
       only adding or removing items rebuilds the detail panel. */

    const NB_ANNOTATION_PRESETS = ["Keyword", "Idea", "Example", "Question", "Definition"];
    // Levels of nesting, counting the top-level item as 1: an item, its
    // sub-item, and that sub-item's sub-item.
    const NB_MAX_ANNOTATION_DEPTH = 3;
    let nbAnnotationCounter = 0;

    function nbAnnotationPlaceholder(annotation) {
      return nbIsKeywordAnnotation(annotation)
        ? "Comma-separated — notes sharing a keyword get linked"
        : "Write anything…";
    }

    function nbCommitEdit() {
      renderNotebook({ includeDetail: false });
    }

    function nbNewAnnotation(label) {
      nbAnnotationCounter += 1;
      return { id: `a${nbAnnotationCounter}`, label, text: "", children: [] };
    }

    function nbFocusAnnotation(id) {
      elements.nbDetail.querySelector(`[data-annotation-id="${id}"]`)?.focus();
    }

    function renderNbAnnotations(note) {
      const section = document.createElement("div");
      section.className = "nb-annotations";

      const heading = document.createElement("div");
      heading.className = "nb-breakdown-label nb-detail-label";
      heading.textContent = "Your annotations";
      section.appendChild(heading);

      // Shared suggestion list for every label field in the panel.
      const presets = document.createElement("datalist");
      presets.id = "nbAnnotationPresets";
      NB_ANNOTATION_PRESETS.forEach((preset) => {
        const option = document.createElement("option");
        option.value = preset;
        presets.appendChild(option);
      });
      section.appendChild(presets);

      if (note.annotations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "nb-annotation-empty";
        empty.textContent = "Nothing added yet — add keywords, ideas, examples, or anything else below.";
        section.appendChild(empty);
      } else {
        const list = document.createElement("div");
        note.annotations.forEach((annotation) => {
          list.appendChild(renderNbAnnotation(annotation, note.annotations));
        });
        section.appendChild(list);
      }

      const addRow = document.createElement("div");
      addRow.className = "nb-add-row";
      [...NB_ANNOTATION_PRESETS.slice(0, 3), ""].forEach((preset) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "nb-mini-button";
        button.textContent = preset ? `+ ${preset}` : "+ Custom field";
        button.addEventListener("click", () => {
          const annotation = nbNewAnnotation(preset);
          note.annotations.push(annotation);
          logEvent("annotation_added", { noteId: note.id, annotationId: annotation.id, label: preset, depth: 1 });
          renderNotebook();
          // A custom field starts on its label so it can be named first.
          nbFocusAnnotation(preset ? annotation.id : `${annotation.id}-label`);
        });
        addRow.appendChild(button);
      });
      section.appendChild(addRow);

      elements.nbDetail.appendChild(section);
    }

    // siblings is the array this annotation lives in, so it can remove
    // itself; depth is its nesting level (top level = 1).
    function renderNbAnnotation(annotation, siblings, depth = 1) {
      const item = document.createElement("div");
      item.className = "nb-annotation";

      const head = document.createElement("div");
      head.className = "nb-annotation-head";

      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.className = "nb-edit-field nb-annotation-label";
      labelInput.value = annotation.label;
      labelInput.placeholder = "Field name";
      labelInput.setAttribute("list", "nbAnnotationPresets");
      labelInput.setAttribute("aria-label", "Annotation type");
      labelInput.dataset.annotationId = `${annotation.id}-label`;
      // An AI suggestion becomes the user's once they edit it or build on
      // it, so the next refinement keeps it instead of replacing it.
      const aiBadge = document.createElement("span");
      aiBadge.className = "nb-ai-badge";
      aiBadge.textContent = "AI";
      aiBadge.title = "Suggested by AI — edit it to make it yours";
      const claimForUser = () => {
        if (annotation.source !== "ai") return;
        logEvent("ai_annotation_claimed", { noteId: state.selectedNoteId, annotationId: annotation.id, label: annotation.label });
        delete annotation.source;
        aiBadge.remove();
        item.classList.remove("ai");
      };
      if (annotation.source === "ai") item.classList.add("ai");

      labelInput.addEventListener("input", () => {
        claimForUser();
        annotation.label = labelInput.value.trim();
        text.placeholder = nbAnnotationPlaceholder(annotation);
      });
      labelInput.addEventListener("change", () => {
        logEvent("annotation_label_edited", { noteId: state.selectedNoteId, annotationId: annotation.id, label: annotation.label, depth });
        nbCommitEdit();
      });

      const addChild = document.createElement("button");
      addChild.type = "button";
      addChild.className = "nb-mini-button";
      addChild.textContent = "+ Sub-item";
      addChild.title = "Add an item nested under this one";
      addChild.addEventListener("click", () => {
        claimForUser();
        const child = nbNewAnnotation("");
        annotation.children.push(child);
        logEvent("annotation_added", { noteId: state.selectedNoteId, annotationId: child.id, parentId: annotation.id, label: "", depth: depth + 1 });
        renderNotebook();
        nbFocusAnnotation(`${child.id}-label`);
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "nb-mini-button nb-remove-button";
      remove.textContent = "×";
      remove.title = "Remove this item";
      remove.setAttribute("aria-label", `Remove ${annotation.label || "annotation"}`);
      remove.addEventListener("click", () => {
        if (annotation.children.length > 0
          && !window.confirm("Remove this item and everything nested under it?")) return;
        siblings.splice(siblings.indexOf(annotation), 1);
        logEvent("annotation_removed", {
          noteId: state.selectedNoteId,
          annotationId: annotation.id,
          label: annotation.label,
          depth,
          wasAiSuggestion: annotation.source === "ai",
          nestedItems: annotation.children.length
        });
        renderNotebook();
      });

      head.append(labelInput);
      if (annotation.source === "ai") head.append(aiBadge);
      if (depth < NB_MAX_ANNOTATION_DEPTH) head.append(addChild);
      head.append(remove);

      const text = document.createElement("textarea");
      text.className = "nb-edit-field nb-annotation-text";
      text.value = annotation.text;
      text.placeholder = nbAnnotationPlaceholder(annotation);
      text.setAttribute("aria-label", `${annotation.label || "Annotation"} text`);
      text.dataset.annotationId = annotation.id;
      text.addEventListener("input", () => {
        claimForUser();
        annotation.text = text.value;
      });
      text.addEventListener("change", () => {
        logEvent("annotation_text_edited", { noteId: state.selectedNoteId, annotationId: annotation.id, label: annotation.label, length: annotation.text.length, depth });
        nbCommitEdit();
      });

      item.append(head, text);

      if (annotation.children.length > 0) {
        const children = document.createElement("div");
        children.className = "nb-annotation-children";
        annotation.children.forEach((child) => {
          children.appendChild(renderNbAnnotation(child, annotation.children, depth + 1));
        });
        item.appendChild(children);
      }

      return item;
    }

    /* ---------- Refine with AI ----------
       One click sends every note (title, captured text, the user's own
       annotations) to Claude Haiku 4.5 and gets back a suggested title,
       keywords, ideas and a plain explanation for each. Those are added as
       annotations marked "AI", so they flow into keywords, clusters and
       connections like anything the user writes.

       - Notes go in batches; each batch is told the keywords already in use
         so it reuses the exact same strings — that's what makes notes link.
       - AI annotations the user hasn't touched are replaced on the next
         run; editing one (or nesting under it) makes it the user's, and it
         is kept from then on.
       - A title is only replaced while it's still the default "Capture N".
       - Limited to NB_CLAUDE_REFINE_LIMIT runs per browser, unless the
         local config below lifts the limit.

       Fires only on an explicit click. */

    const NB_CLAUDE_MODEL = "claude-haiku-4-5";
    const NB_CLAUDE_REFINE_LIMIT = 5;
    const NB_CLAUDE_REFINES_USED_KEY = "nb_claude_refines_used";
    const NB_CLAUDE_BATCH_SIZE = 20;

    /* --- Local developer config ---
       Optional local-config.json next to this file, e.g.
         { "unlimitedRefines": true }
       It's gitignored, so it never reaches GitHub Pages, and it's only
       requested at all when the page is served from this machine
       (localhost / 127.0.0.1, e.g. VS Code Live Server). */

    const NB_LOCAL_CONFIG_FILE = "local-config.json";
    const NB_IS_LOCALHOST = ["localhost", "127.0.0.1", "[::1]"].includes(window.location.hostname);
    let nbLocalConfig = {};

    async function nbLoadLocalConfig() {
      if (!NB_IS_LOCALHOST) return;
      try {
        const response = await fetch(NB_LOCAL_CONFIG_FILE, { cache: "no-store" });
        if (response.ok) nbLocalConfig = await response.json();
      } catch (error) {
        console.warn(`[notebook] ignoring unreadable ${NB_LOCAL_CONFIG_FILE}:`, error);
      }
    }

    function nbUnlimitedRefines() {
      return nbLocalConfig?.unlimitedRefines === true;
    }

    /* --- API key ---
       Read from ai-key.json next to this file: { "version": 1, "key": "<encoded>" },
       where <encoded> is the key XOR'd with NB_KEY_SECRET, then base64'd.
       Generate it by opening this page and running, in the DevTools console:
         nbEncodeApiKey("sk-ant-...")
       and saving the printed JSON as ai-key.json.

       ⚠ The page is published on GitHub Pages with ai-key.json alongside
       it, so treat the key as public. The encoding only keeps it from being
       readable at a glance — the secret to decode it is right here, and
       anyone using the page can see it in its network requests. The
       per-browser refine limit only governs this page, not the key itself.
       Spending is capped on Anthropic's side instead: prepaid credits with
       auto-reload off, and the key in its own workspace with a spend limit.

       Browsers block fetch() from file:// pages, so the page must be served
       (GitHub Pages, or `python -m http.server` locally) for the key file
       to load. */

    const NB_KEY_FILE = "ai-key.json";
    const NB_KEY_SECRET = "proto-v4/notebook-app";

    function nbXorWithSecret(bytes) {
      const secret = new TextEncoder().encode(NB_KEY_SECRET);
      return bytes.map((byte, i) => byte ^ secret[i % secret.length]);
    }

    // DevTools helper — prints the JSON to save as ai-key.json.
    window.nbEncodeApiKey = (apiKey) => {
      const encoded = nbXorWithSecret(new TextEncoder().encode(apiKey.trim()));
      return JSON.stringify({ version: 1, key: btoa(String.fromCharCode(...encoded)) }, null, 2);
    };

    let nbApiKeyPromise = null;

    function nbLoadApiKey() {
      if (!nbApiKeyPromise) {
        nbApiKeyPromise = (async () => {
          const response = await fetch(NB_KEY_FILE, { cache: "no-store" });
          if (!response.ok) throw new Error(`${NB_KEY_FILE} not found (${response.status})`);
          const { key } = await response.json();
          const bytes = Uint8Array.from(atob(key), (c) => c.charCodeAt(0));
          return new TextDecoder().decode(nbXorWithSecret(bytes));
        })();
        // Don't cache a failure — the file may be added without a reload.
        nbApiKeyPromise.catch(() => {
          nbApiKeyPromise = null;
        });
      }
      return nbApiKeyPromise;
    }

    const NB_AI_SYSTEM_PROMPT = `You help a student refine notes they captured from live lecture captions. Caption text comes from speech recognition and may contain recognition errors — infer what the speaker meant.

For each note you're given, return:
- suggestedTitle: a short title (2–6 words) naming the note's concept.
- keywords: 2–5 key concepts as short lowercase phrases. Notes about the same concept must get the exact same keyword string so they can be linked; reuse strings from the provided keyword vocabulary whenever one fits instead of inventing a near-synonym. Skip keywords so broad they'd fit every note (such as the subject's name) — they'd link everything to everything.
- ideas: 1–3 short ideas that build on the note — an implication, a link to another note, or a question worth exploring.
- explanation: 1–3 plain sentences explaining the note's concept to a first-year student.
- termDefinitions: one entry for every keyword the note will have — the student's own (from Keyword or Tag annotations) and the ones you return in keywords — defining that term in 1–2 plain sentences as it's used in this note, not as a generic dictionary entry. Use the term string exactly as written.
- topic: the single topic this note belongs to, as a short name (1–4 words). Topics group the notebook into clusters, so notes on the same topic must get exactly the same topic string — reuse a name from the provided topic list whenever one fits. Aim for topics that each gather a few notes: not so broad that every note shares one (such as the subject's name), not so narrow that every note gets its own.
- links: the other notes this note is meaningfully related to, chosen from the whole notebook index (not only the notes in this request) — the same idea, a cause or effect, an example of it, a contrast, or one building on the other. For each: id (from the index; never the note's own id), strength (1 = loosely related, 2 = clearly related, 3 = closely related or the same idea), and reason (a short phrase, at most 12 words, saying how they relate). Only include real relationships — an empty list is fine, and a few strong links beat many weak ones.

Notes — both the ones to refine and the entries in the notebook index — may include sentenceContext: the sentence the speaker was saying when the student captured (currentSentence) and the one before it (previousSentence). Use it to understand what the captured text refers to and to correct recognition errors, and use it when choosing topics and judging links, since a short captured fragment can be ambiguous on its own. Keep each note's title, keywords, ideas and explanation focused on its captured text.

Write in the same language as the note's captured text. Build on the student's own annotations rather than repeating them. Return exactly one entry per note id.`;

    const NB_TERM_DEFINITIONS_SCHEMA = {
      type: "array",
      items: {
        type: "object",
        additionalProperties: false,
        required: ["term", "definition"],
        properties: {
          term: { type: "string" },
          definition: { type: "string" }
        }
      }
    };

    const NB_CLAUDE_RESPONSE_SCHEMA = {
      type: "object",
      additionalProperties: false,
      required: ["notes"],
      properties: {
        notes: {
          type: "array",
          items: {
            type: "object",
            additionalProperties: false,
            required: ["id", "suggestedTitle", "keywords", "ideas", "explanation", "termDefinitions", "topic", "links"],
            properties: {
              id: { type: "string" },
              suggestedTitle: { type: "string" },
              keywords: { type: "array", items: { type: "string" } },
              ideas: { type: "array", items: { type: "string" } },
              explanation: { type: "string" },
              termDefinitions: NB_TERM_DEFINITIONS_SCHEMA,
              topic: { type: "string" },
              links: {
                type: "array",
                items: {
                  type: "object",
                  additionalProperties: false,
                  required: ["id", "strength", "reason"],
                  properties: {
                    id: { type: "string" },
                    strength: { type: "integer", enum: [1, 2, 3] },
                    reason: { type: "string" }
                  }
                }
              }
            }
          }
        }
      }
    };

    function nbIsDefaultTitle(note) {
      return /^Capture \d+$/.test(note.concept) || note.concept === "Untitled note";
    }

    function nbUserAnnotations(annotations) {
      return (annotations || [])
        .filter((a) => a.source !== "ai")
        .map((a) => ({ label: a.label, text: a.text, children: nbUserAnnotations(a.children) }));
    }

    function nbNotePayload(note) {
      const payload = {
        id: note.id,
        title: nbIsDefaultTitle(note) ? "" : note.concept,
        capturedText: note.phrase,
        studentAnnotations: nbUserAnnotations(note.annotations)
      };
      if (note.currentSentence !== undefined) {
        payload.sentenceContext = {
          previousSentence: note.previousSentence || "",
          currentSentence: note.currentSentence || ""
        };
      }
      return payload;
    }

    function nbKeywordVocabulary(notes) {
      return [...new Set(notes.flatMap((n) => [...nbUserKeywords(n.annotations)]))];
    }

    function nbTopicVocabulary(notes) {
      return [...new Set(notes.map((n) => n.topic).filter(Boolean))];
    }

    const nbTrim = (text, max) => (text.length > max ? `${text.slice(0, max)}…` : text);

    // Every note in the notebook, briefly, so each batch can link its notes
    // to notes in other batches — including each note's sentence context,
    // so links are judged on what was actually being said, not just the
    // captured fragment. Text is trimmed to keep this small.
    function nbNotebookIndex(notes) {
      return notes.map((n) => {
        const entry = {
          id: n.id,
          title: nbIsDefaultTitle(n) ? "" : n.concept,
          capturedText: nbTrim(n.phrase, 200)
        };
        if (n.currentSentence !== undefined) {
          entry.sentenceContext = {
            previousSentence: nbTrim(n.previousSentence || "", 150),
            currentSentence: nbTrim(n.currentSentence || "", 150)
          };
        }
        return entry;
      });
    }

    // Pairs of notes with any link, and clusters of 2+ — for the before/after
    // summary shown once a refinement finishes.
    function nbGraphStats(notes) {
      const { sharedCounts } = nbBuildGraph(notes);
      let links = 0;
      notes.forEach((a) => notes.forEach((b) => {
        if (a.id < b.id && sharedCounts[a.id][b.id] >= 1) links += 1;
      }));
      const clusters = nbClusterNotes(notes, sharedCounts).filter((g) => g.length > 1).length;
      return { links, clusters };
    }

    function nbApplyRefinement(note, result, noteIds) {
      // Untouched AI suggestions from an earlier run are replaced, not stacked.
      note.annotations = note.annotations.filter((a) => a.source !== "ai");

      if (nbIsDefaultTitle(note) && result.suggestedTitle.trim()) {
        note.concept = result.suggestedTitle.trim();
      }

      const add = (label, text) => {
        if (!text.trim()) return;
        const annotation = nbNewAnnotation(label);
        annotation.text = text.trim();
        annotation.source = "ai";
        note.annotations.push(annotation);
      };

      const existing = nbUserKeywords(note.annotations);
      const keywords = [...new Set(result.keywords.map((k) => normaliseWhitespace(k)).filter(Boolean))]
        .filter((k) => !existing.has(k.toLocaleLowerCase()));
      add("Keyword", keywords.join(", "));
      result.ideas.forEach((idea) => add("Idea", idea));
      add("Explanation", result.explanation);
      nbSetTermDefinitions(note, result.termDefinitions);

      // Topic and links are the AI's latest judgement, replaced each run.
      note.topic = normaliseWhitespace(result.topic) || undefined;
      note.aiLinks = nbSanitizeAiLinks(result.links, note.id, noteIds);
    }

    // Keeps only links to other notes that exist, one per target (the
    // strongest), with a valid strength.
    function nbSanitizeAiLinks(links, ownId, noteIds) {
      const byTarget = new Map();
      (Array.isArray(links) ? links : []).forEach((link) => {
        if (!link || typeof link.id !== "string" || link.id === ownId || !noteIds.has(link.id)) return;
        const strength = Number(link.strength);
        if (![1, 2, 3].includes(strength)) return;
        const reason = typeof link.reason === "string" ? normaliseWhitespace(link.reason) : "";
        const existing = byTarget.get(link.id);
        if (!existing || strength > existing.strength) byTarget.set(link.id, { id: link.id, strength, reason });
      });
      return [...byTarget.values()];
    }

    let nbClaudeRefinesUsedFallback = 0;

    function nbClaudeRefinesUsed() {
      try {
        return Number(window.localStorage.getItem(NB_CLAUDE_REFINES_USED_KEY)) || 0;
      } catch (error) {
        return nbClaudeRefinesUsedFallback;
      }
    }

    function nbCountClaudeRefine() {
      // Local unlimited runs don't eat into the browser's normal allowance.
      if (nbUnlimitedRefines()) return;
      const used = nbClaudeRefinesUsed() + 1;
      nbClaudeRefinesUsedFallback = used;
      try {
        window.localStorage.setItem(NB_CLAUDE_REFINES_USED_KEY, String(used));
      } catch (error) {
        console.warn("[notebook] could not persist the refine count:", error);
      }
    }

    function nbClaudeRefinesLeft() {
      if (nbUnlimitedRefines()) return Infinity;
      return Math.max(0, NB_CLAUDE_REFINE_LIMIT - nbClaudeRefinesUsed());
    }

    async function nbRequestClaudeRefinement(apiKey, batch, notes) {
      const content = [
        `Keyword vocabulary already in use: ${JSON.stringify(nbKeywordVocabulary(notes))}`,
        `Topics already in use: ${JSON.stringify(nbTopicVocabulary(notes))}`,
        `Notebook index (every note, for links):\n${JSON.stringify(nbNotebookIndex(notes))}`,
        `Notes to refine:\n${JSON.stringify(batch.map(nbNotePayload), null, 2)}`
      ].join("\n\n");
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: NB_CLAUDE_MODEL,
          max_tokens: 16000,
          system: NB_AI_SYSTEM_PROMPT,
          output_config: {
            format: { type: "json_schema", schema: NB_CLAUDE_RESPONSE_SCHEMA }
          },
          messages: [{ role: "user", content }]
        })
      });

      if (!response.ok) {
        const detail = await response.json().catch(() => null);
        const error = new Error(detail?.error?.message || `Request failed (${response.status})`);
        error.status = response.status;
        throw error;
      }

      const data = await response.json();
      // Actual spend, for checking cost estimates (Haiku 4.5: $1 / $5 per
      // million input / output tokens).
      if (data.usage) {
        const { input_tokens: inputTokens, output_tokens: outputTokens } = data.usage;
        const cost = (inputTokens * 1 + outputTokens * 5) / 1e6;
        logEvent("ai_refine_request", { notes: batch.length, inputTokens, outputTokens, costUsd: Number(cost.toFixed(5)), stopReason: data.stop_reason });
        console.info(`[notebook] refine request: ${batch.length} notes · ${inputTokens} input + ${outputTokens} output tokens ≈ $${cost.toFixed(4)}`);
      }
      if (data.stop_reason === "refusal") throw new Error("Claude declined to refine these notes.");
      if (data.stop_reason === "max_tokens") throw new Error("The response was cut off — try again with fewer notes.");

      const text = data.content.filter((block) => block.type === "text").map((block) => block.text).join("");
      return JSON.parse(text).notes;
    }

    function nbSetAiStatus(message, isError = false) {
      elements.nbAiStatus.textContent = message;
      elements.nbAiStatus.classList.toggle("error", isError);
    }

    function nbRefinesLeftText() {
      if (nbUnlimitedRefines()) return `unlimited refines (${NB_LOCAL_CONFIG_FILE})`;
      return `${nbClaudeRefinesLeft()} of ${NB_CLAUDE_REFINE_LIMIT} refines left in this browser`;
    }

    async function nbRefineAll() {
      const notes = state.notes;
      if (notes.length === 0) return;

      if (nbClaudeRefinesLeft() === 0) {
        logEvent("ai_refine_blocked", { reason: "limit_reached" });
        nbSetAiStatus(`All ${NB_CLAUDE_REFINE_LIMIT} refines for this browser have been used.`, true);
        return;
      }

      logEvent("ai_refine_started", { notes: notes.length });
      elements.nbRefineButton.disabled = true;
      elements.nbRefineButton.textContent = "Refining…";

      let apiKey;
      try {
        apiKey = await nbLoadApiKey();
      } catch (error) {
        console.error("[notebook] could not load the API key:", error);
        logEvent("ai_refine_failed", { status: null, message: "API key file could not be loaded" });
        nbSetAiStatus(`Couldn't load ${NB_KEY_FILE} — make sure it's next to this page and the folder is served (e.g. python -m http.server), not opened as a file.`, true);
        elements.nbRefineButton.disabled = false;
        elements.nbRefineButton.textContent = "✨ Refine with AI";
        return;
      }

      const before = nbGraphStats(notes);
      let counted = false;

      try {
        for (let start = 0; start < notes.length; start += NB_CLAUDE_BATCH_SIZE) {
          const batch = notes.slice(start, start + NB_CLAUDE_BATCH_SIZE);
          nbSetAiStatus(`Refining notes ${start + 1}–${start + batch.length} of ${notes.length}…`);

          const results = await nbRequestClaudeRefinement(apiKey, batch, notes);
          // One refine is used up once a request has actually succeeded —
          // a rejected key or a network failure doesn't count.
          if (!counted) {
            nbCountClaudeRefine();
            counted = true;
          }
          // The notes were replaced (a notebook was opened, or the first
          // real capture replaced the samples) while this was in flight.
          if (state.notes !== notes) return;

          const noteIds = new Set(notes.map((n) => n.id));
          results.forEach((result) => {
            const note = batch.find((n) => n.id === result.id);
            if (note) nbApplyRefinement(note, result, noteIds);
          });
          renderNotebook();
        }

        const after = nbGraphStats(notes);
        logEvent("ai_refine_completed", {
          notes: notes.length,
          linksBefore: before.links,
          linksAfter: after.links,
          clustersBefore: before.clusters,
          clustersAfter: after.clusters
        });
        nbSetAiStatus(`Refined ${notes.length} note${notes.length === 1 ? "" : "s"} · links ${before.links} → ${after.links} · clusters ${before.clusters} → ${after.clusters} · ${nbRefinesLeftText()}`);
      } catch (error) {
        console.error("[notebook] AI refinement failed:", error);
        logEvent("ai_refine_failed", { status: error.status ?? null, message: error.message });
        nbSetAiStatus(error.status === 401
          ? `The API key in ${NB_KEY_FILE} was rejected — it may be wrong or revoked.`
          : `Refinement stopped: ${error.message}`, true);
        renderNotebook();
      } finally {
        elements.nbRefineButton.disabled = false;
        elements.nbRefineButton.textContent = "✨ Refine with AI";
      }
    }

    elements.nbRefineButton.addEventListener("click", nbRefineAll);

    /* ---------- Saving and reopening a notebook ----------
       Like a USB stick: "Download notebook" writes every note (text,
       title, annotations, AI suggestions, sentence context, timing) to a
       JSON file, and "Open notebook" loads such a file back — no capture
       session needed. Captures from later sessions are added to whatever
       notebook is open. */

    const NB_FILE_FORMAT = "proto-v4-notebook";
    // 2 added interactionLog / interactionSummary and per-note capture records.
    const NB_FILE_VERSION = 2;

    // Quick overview of the log for analysis; the full detail is in
    // interactionLog itself.
    function nbInteractionSummary(log) {
      const byType = {};
      const sessions = {};
      log.forEach((e) => {
        byType[e.type] = (byType[e.type] || 0) + 1;
        const s = (sessions[e.session] ||= { session: e.session, firstEventAt: e.t, lastEventAt: e.t, events: 0 });
        s.events += 1;
        if (e.t < s.firstEventAt) s.firstEventAt = e.t;
        if (e.t > s.lastEventAt) s.lastEventAt = e.t;
      });
      return {
        events: log.length,
        sessions: Object.values(sessions).sort((a, b) => a.firstEventAt.localeCompare(b.firstEventAt)),
        byType
      };
    }

    function nbHasUnsavedChanges() {
      return !state.usingSampleNotes
        && state.notes.length > 0
        && JSON.stringify(state.notes) !== state.nbSavedJson;
    }

    function nbDownloadNotebook() {
      if (state.usingSampleNotes || state.notes.length === 0) return;
      // Logged first, so the download itself is part of the saved log.
      logEvent("notebook_downloaded", { notes: state.notes.length });
      const file = {
        format: NB_FILE_FORMAT,
        version: NB_FILE_VERSION,
        savedAt: new Date().toISOString(),
        notes: state.notes,
        interactionSummary: nbInteractionSummary(state.interactionLog),
        interactionLog: state.interactionLog
      };
      downloadBlob(
        new Blob([JSON.stringify(file, null, 2)], { type: "application/json" }),
        `notebook-${timestampForFilename()}.json`
      );
      state.nbSavedJson = JSON.stringify(state.notes);
      nbSetAiStatus(`Downloaded ${state.notes.length} note${state.notes.length === 1 ? "" : "s"}. Use “Open notebook” to continue from this file later.`);
    }

    const nbString = (value, fallback = "") => (typeof value === "string" ? value : fallback);

    // Saved files may have been hand-edited, so the fields the views rely
    // on are checked and defaulted. Everything is later rendered as text,
    // never HTML. Unknown fields are kept as they are.
    function nbSanitizeAnnotations(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter((a) => a && typeof a === "object")
        .map((a) => ({
          ...a,
          id: nbString(a.id) || nbNewAnnotation("").id,
          label: nbString(a.label),
          text: nbString(a.text),
          children: nbSanitizeAnnotations(a.children)
        }));
    }

    function nbSanitizeNote(raw, index) {
      if (!raw || typeof raw !== "object" || typeof raw.id !== "string" || !raw.id) {
        throw new Error(`note ${index + 1} is missing its id`);
      }
      const elapsedS = Number.isFinite(raw.elapsedS) ? Math.max(0, raw.elapsedS) : 0;
      const phrase = nbString(raw.phrase);
      return {
        ...raw,
        elapsedS,
        timeLabel: nbString(raw.timeLabel, nbFormatElapsed(elapsedS)),
        concept: nbString(raw.concept) || "Untitled note",
        phrase,
        originalPhrase: nbString(raw.originalPhrase, phrase),
        annotations: nbSanitizeAnnotations(raw.annotations),
        termDefinitions: (Array.isArray(raw.termDefinitions) ? raw.termDefinitions : [])
          .filter((d) => d && typeof d.term === "string" && typeof d.definition === "string")
          .map((d) => ({ term: d.term, definition: d.definition })),
        topic: nbString(raw.topic) || undefined
        // aiLinks are checked in nbParseNotebookFile, once every id is known.
      };
    }

    function nbParseNotebookFile(text) {
      let data;
      try {
        data = JSON.parse(text);
      } catch (error) {
        throw new Error("it isn't valid JSON");
      }
      if (data?.format !== NB_FILE_FORMAT || !Array.isArray(data.notes)) {
        throw new Error("it isn't a notebook downloaded from this app");
      }
      if (data.version > NB_FILE_VERSION) {
        throw new Error("it was saved by a newer version of this app");
      }
      const notes = data.notes.map(nbSanitizeNote);
      const noteIds = new Set(notes.map((n) => n.id));
      if (noteIds.size !== notes.length) {
        throw new Error("two notes share the same id");
      }
      // A note keeps aiLinks only if it had them (i.e. it was refined), so
      // unrefined notes still fall back to word overlap.
      notes.forEach((note) => {
        if (Array.isArray(note.aiLinks)) note.aiLinks = nbSanitizeAiLinks(note.aiLinks, note.id, noteIds);
        else delete note.aiLinks;
      });
      // Files from before version 2 have no log; entries are kept as saved
      // as long as they have the basic shape.
      const log = (Array.isArray(data.interactionLog) ? data.interactionLog : [])
        .filter((e) => e && typeof e === "object" && typeof e.type === "string" && typeof e.t === "string");
      return { notes, log };
    }

    // New annotations must not reuse an id from the opened file.
    function nbBumpAnnotationCounter(notes) {
      const visit = (list) => list.forEach((a) => {
        const n = Number(/^a(\d+)$/.exec(a.id)?.[1]);
        if (n > nbAnnotationCounter) nbAnnotationCounter = n;
        visit(a.children);
      });
      notes.forEach((note) => visit(note.annotations));
    }

    async function nbOpenNotebookFile(file) {
      let notes;
      let log;
      try {
        ({ notes, log } = nbParseNotebookFile(await file.text()));
      } catch (error) {
        logEvent("notebook_open_failed", { fileName: file.name, message: error.message });
        nbSetAiStatus(`Couldn't open ${file.name}: ${error.message}.`, true);
        return;
      }

      nbBumpAnnotationCounter(notes);
