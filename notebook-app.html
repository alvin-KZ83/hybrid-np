<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech Capture Pilot (Notebook, 500 ms)</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0f14;
      --panel: #151b23;
      --border: #303946;
      --text: #f4f7fb;
      --muted: #9ba8b7;
      --accent: #70b7ff;
      --accent-text: #07111c;
      --danger: #ff7474;

      /* Caption sizing. The "primary" size applies to whichever pane
         (source or translation) currently has focus; "secondary" applies
         to the other one. Click either caption box to swap which is primary. */
      --subtitle-window-width: 100%;
      --caption-primary-height: 300px;
      --caption-primary-font-size: 4.5rem;
      --caption-secondary-height: 140px;
      --caption-secondary-font-size: 1.8rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      margin: 0;
      padding: 12px 12px 36px;
    }

    .session-screen {
      height: calc(100vh - 24px);
      height: calc(100svh - 24px);
      min-height: 600px;
      display: grid;
      grid-template-rows: minmax(0, 2fr) minmax(0, 1fr);
      gap: 12px;
    }

    .control-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(32px, auto) minmax(52px, 1fr) minmax(52px, 1fr) minmax(52px, 1fr) auto;
      gap: 10px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 650;
      color: var(--muted);
      cursor: pointer;
    }

    .toggle-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 20px;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lang-switch-label {
      margin-right: 4px;
      font-size: 0.85rem;
      font-weight: 650;
      color: var(--muted);
    }

    .lang-option {
      width: auto;
      min-height: 0;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 7px;
    }

    .lang-option[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    /* Same specificity tie-break as [hidden] vs .caption-box{display:grid}
       resolves to the author rule below, since it's more specific
       (class + attribute), so this reliably hides the translation pane
       when the toggle is off. */
    .caption-box[hidden] {
      display: none;
    }

    .translator-loading {
      display: grid;
      gap: 4px;
      align-content: center;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .translator-loading[hidden] {
      display: none;
    }

    .translator-loading-track {
      height: 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .translator-loading-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 160ms ease;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: 700 1rem/1.2 inherit;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, border-color 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #startStopButton,
    #captureButton,
    .position-button {
      height: 100%;
      min-height: 0;
    }

    .position-controls {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .position-button {
      font-size: 0.95rem;
    }

    .subtitle-stage {
      position: relative;
      min-height: 0;
    }

    #captureButton {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-size: 1.2rem;
    }

    .caption-stack {
      position: absolute;
      inset-inline: 0;
      top: 50%;
      width: var(--subtitle-window-width);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform: translateY(-50%);
      transition: top 220ms ease, transform 220ms ease;
    }

    .subtitle-stage[data-anchor="top"] .caption-stack {
      top: 0;
      transform: translateY(0);
    }

    .subtitle-stage[data-anchor="upper"] .caption-stack {
      top: 25%;
      transform: translateY(-25%);
    }

    .subtitle-stage[data-anchor="middle"] .caption-stack {
      top: 50%;
      transform: translateY(-50%);
    }

    .subtitle-stage[data-anchor="lower"] .caption-stack {
      top: 75%;
      transform: translateY(-75%);
    }

    .subtitle-stage[data-anchor="bottom"] .caption-stack {
      top: 100%;
      transform: translateY(-100%);
    }

    .caption-box {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 20px 34px;
      overflow: hidden;
      background: #030507;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      color: inherit;
      font: inherit;
      cursor: pointer;
      height: min(var(--caption-secondary-height), 80svh);
      transition: height 200ms ease, border-color 160ms ease, transform 120ms ease;
    }

    .caption-box:hover {
      border-color: var(--accent);
    }

    .caption-box:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .caption-stack[data-primary-pane="source"] .caption-box[data-pane="source"],
    .caption-stack[data-primary-pane="translation"] .caption-box[data-pane="translation"] {
      height: min(var(--caption-primary-height), 80svh);
    }

    #subtitle,
    #translation {
      width: 100%;
      max-width: 100%;
      display: grid;
      gap: 0.18em;
      text-align: center;
      font-size: var(--caption-secondary-font-size);
      font-weight: 760;
      line-height: 1.35;
      letter-spacing: 0;
      transition: font-size 120ms ease;
    }

    .caption-stack[data-primary-pane="source"] #subtitle,
    .caption-stack[data-primary-pane="translation"] #translation {
      font-size: var(--caption-primary-font-size);
    }

    .caption-line {
      min-height: 1.35em;
      white-space: nowrap;
    }

    #subtitle.placeholder,
    #translation.placeholder {
      color: #667280;
      font-weight: 560;
    }

    .interim {
      color: #a9d2ff;
    }

    #notice {
      margin: 0 0 18px;
      padding: 13px 15px;
      border: 1px solid color-mix(in srgb, var(--danger) 60%, var(--border));
      border-radius: 10px;
      color: #ffd1d1;
      background: rgba(255, 116, 116, 0.08);
      line-height: 1.45;
    }

    #results {
      margin-top: 24px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    #results[hidden] {
      display: none;
    }

    #results h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    #results p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .results-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 20px;
    }

    .results-action-button {
      width: auto;
      min-height: 0;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 650;
      border-radius: 8px;
    }

    .result-list {
      display: grid;
      gap: 12px;
    }

    .result-card {
      padding: 14px 15px;
      background: #0d1218;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .result-comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-output {
      min-width: 0;
      padding: 12px;
      background: #070a0e;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .result-output h2 {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .result-status {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
    }

    .result-phrase {
      min-height: 3em;
      font-size: 1.05rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .result-context {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: grid;
      gap: 4px;
    }

    .context-line {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .context-label {
      font-weight: 750;
      color: var(--text);
    }

    .blank {
      color: var(--muted);
      font-style: italic;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .caption-stack,
      .caption-box {
        transition: none;
      }
    }

    @media (max-width: 600px) {
      main {
        width: 100%;
        padding: 8px 8px 24px;
      }

      .session-screen {
        height: calc(100vh - 16px);
        height: calc(100svh - 16px);
        min-height: 540px;
        gap: 8px;
      }

      .control-panel,
      .position-controls {
        gap: 8px;
      }

      .caption-box {
        height: min(var(--caption-secondary-height), 24svh);
        padding: 14px 12px;
      }

      .caption-stack[data-primary-pane="source"] .caption-box[data-pane="source"],
      .caption-stack[data-primary-pane="translation"] .caption-box[data-pane="translation"] {
        height: min(var(--caption-primary-height), 46svh);
      }

      .result-comparison {
        grid-template-columns: 1fr;
      }
    }

    /* ===================== Shell + Notebook additions ===================== */

    .screen[hidden] {
      display: none;
    }

    .top-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .nav-button {
      width: auto;
      min-height: 0;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
    }

    .nav-button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    #notebookScreen {
      padding: 4px 0 40px;
    }

    .nb-header h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
    }

    .nb-header p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 68ch;
    }

    .nb-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
    }

    .nb-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .nb-tab {
      width: auto;
      min-height: 0;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 650;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
    }

    .nb-tab[aria-pressed="true"] {
      background: #0b0f14;
      color: var(--text);
    }

    .nb-search {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }

    .nb-search input {
      width: 140px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .nb-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 800px) {
      .nb-layout {
        grid-template-columns: 1fr;
      }
    }

    .nb-panel {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .nb-chip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    .nb-chip {
      text-align: left;
      width: auto;
      min-height: 0;
      padding: 8px 10px;
      border-radius: 9px;
      background: #0d1218;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
    }

    .nb-chip.active {
      background: var(--text);
      color: #0b0f14;
      border-color: var(--text);
    }

    .nb-chip-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      margin-right: 5px;
    }

    .nb-chip-time {
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .nb-chip-concept {
      font-weight: 650;
      margin-top: 2px;
    }

    .nb-empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 20px 4px;
      text-align: center;
    }

    .nb-timeline {
      position: relative;
      height: 52px;
      margin: 14px 4px 30px;
    }

    .nb-timeline-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: var(--border);
      transform: translateY(-1px);
    }

    .nb-timeline-dot {
      position: absolute;
      top: 50%;
      min-height: 0;
      width: 12px;
      height: 12px;
      padding: 0;
      border-radius: 999px;
      border: 2px solid #0b0f14;
      box-shadow: 0 0 0 1px var(--border);
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    .nb-timeline-dot.selected {
      width: 16px;
      height: 16px;
      border-color: var(--text);
    }

    .nb-timeline-tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 52px;
      background: var(--border);
    }

    .nb-timeline-tick span {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.68rem;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      white-space: nowrap;
    }

    .nb-density-bars {
      display: flex;
      gap: 3px;
      height: 64px;
      margin: 10px 0;
    }

    .nb-density-bar {
      flex: 1;
      min-height: 0;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: #0d1218;
      height: 100%;
    }

    .nb-density-bar.active {
      border-color: var(--text);
    }

    .nb-cluster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .nb-cluster-card {
      padding: 12px;
      border-radius: 10px;
      background: #0d1218;
    }

    .nb-ego {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .nb-ego-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 750;
      padding: 8px;
    }

    .nb-ego-node {
      position: absolute;
      min-height: 0;
      width: 84px;
      height: 84px;
      border-radius: 999px;
      background: #0d1218;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.66rem;
      font-weight: 600;
      padding: 6px;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    .nb-breakdown-section {
      margin-bottom: 18px;
    }

    .nb-breakdown-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .nb-term-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 0;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      background: #0d1218;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .nb-ai-button {
      width: auto;
      min-height: 0;
      margin-left: 4px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 7px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
    }

    .nb-ai-button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .nb-ai-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      margin: -6px 0 14px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .nb-ai-status:empty {
      display: none;
    }

    .nb-ai-status.error {
      color: var(--danger);
    }

    .nb-ai-badge {
      flex: none;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .nb-annotation.ai {
      border-left-style: dashed;
    }

    .nb-note-quote {
      padding: 10px 12px;
      border-radius: 8px;
      background: #0d1218;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 10px 0 16px;
    }

    /* ----- Editable note detail ----- */

    .nb-edit-field {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #0d1218;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .nb-edit-field:hover {
      border-color: var(--border);
    }

    .nb-edit-field:focus {
      outline: none;
      border-color: var(--accent);
    }

    .nb-edit-field::placeholder {
      color: var(--muted);
    }

    textarea.nb-edit-field {
      resize: vertical;
      field-sizing: content;
      min-height: 2.8em;
    }

    .nb-edit-title {
      margin-bottom: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      background: transparent;
    }

    textarea.nb-note-quote {
      margin: 0 0 6px;
      font-size: 0.9rem;
    }

    .nb-detail-label {
      margin-top: 18px;
    }

    .nb-mini-button {
      width: auto;
      min-height: 0;
      padding: 4px 9px;
      font-size: 0.72rem;
      font-weight: 650;
      border-radius: 6px;
    }

    .nb-mini-button[hidden] {
      display: none;
    }

    .nb-annotation-empty {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .nb-annotation {
      margin-bottom: 10px;
      padding-left: 10px;
      border-left: 2px solid var(--border);
    }

    .nb-annotation:focus-within {
      border-left-color: var(--accent);
    }

    .nb-annotation-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .nb-annotation-label {
      flex: 1;
      min-width: 0;
      padding: 3px 6px;
      background: transparent;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nb-remove-button {
      padding: 4px 8px;
    }

    .nb-annotation-children {
      margin-top: 8px;
      margin-left: 6px;
    }

    .nb-add-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body>
  <main>
    <nav class="top-nav" aria-label="App sections">
      <button type="button" id="navCaptureButton" class="nav-button" aria-pressed="true">Capture</button>
      <button type="button" id="navNotebookButton" class="nav-button" aria-pressed="false">Notebook</button>
    </nav>

    <div id="captureScreen" class="screen">
    <p id="notice" hidden></p>

    <section class="session-screen" aria-label="Speech capture controls">
      <div id="subtitleStage" class="subtitle-stage" data-anchor="middle">
        <div id="captionStack" class="caption-stack" data-primary-pane="source">
          <button
            type="button"
            id="sourceCaptionBox"
            class="caption-box"
            data-pane="source"
            aria-pressed="true"
            aria-label="Original subtitle. Activate to show it as primary."
          >
            <div id="subtitle" class="placeholder" aria-live="polite">Press “Start recognition” to begin.</div>
          </button>

          <button
            type="button"
            id="translationCaptionBox"
            class="caption-box"
            data-pane="translation"
            aria-pressed="false"
            aria-label="Translated subtitle. Activate to show it as primary."
          >
            <div id="translation" class="placeholder" aria-live="polite">Press “Start recognition” to begin.</div>
          </button>
        </div>
      </div>

      <div class="control-panel">
        <div class="settings-row">
          <div class="lang-switch" role="group" aria-label="Speech language">
            <span class="lang-switch-label">Speech</span>
            <button type="button" class="lang-option" data-lang="en" aria-pressed="true">English</button>
            <button type="button" class="lang-option" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
          </div>

          <label class="toggle-row" for="translationToggle">
            <input type="checkbox" id="translationToggle" checked />
            <span id="translationToggleText">Live translation (English → Japanese)</span>
          </label>
        </div>

        <button id="startStopButton" type="button">Start recognition</button>

        <div class="position-controls" aria-label="Subtitle position controls">
          <button id="moveUpButton" class="position-button" type="button" aria-label="Move subtitle window upward">▲ Up</button>
          <button id="moveDownButton" class="position-button" type="button" aria-label="Move subtitle window downward">Down ▼</button>
        </div>

        <button id="captureButton" type="button" disabled>Capture</button>

        <div id="translatorLoading" class="translator-loading" hidden aria-live="polite">
          <div id="translatorLoadingLabel"></div>
          <div class="translator-loading-track">
            <div id="translatorLoadingBar" class="translator-loading-bar"></div>
          </div>
        </div>
      </div>
    </section>
    <p id="positionStatus" class="sr-only" aria-live="polite"></p>

    <section id="results" hidden aria-live="polite">
      <h1>Raw and delay-adjusted captures</h1>
      <p id="resultsSummary"></p>
      <div class="results-actions">
        <button id="copyJsonButton" type="button" class="results-action-button" disabled>Copy as JSON</button>
        <button id="downloadCsvButton" type="button" class="results-action-button" disabled>Download CSV</button>
      </div>
      <div id="resultList" class="result-list"></div>
    </section>
    </div><!-- /captureScreen -->

    <div id="notebookScreen" class="screen" hidden>
      <div class="nb-header">
        <h1>Notebook</h1>
        <p id="nbSubtitle">Showing sample notes from a Microeconomics 101 session.</p>
      </div>

      <div class="nb-controls">
        <div class="nb-tabs" id="nbTabs" role="tablist">
          <button type="button" class="nb-tab" data-view="list" aria-pressed="true">All notes</button>
          <button type="button" class="nb-tab" data-view="chrono" aria-pressed="false">Chronological</button>
          <button type="button" class="nb-tab" data-view="density" aria-pressed="false">Density</button>
          <button type="button" class="nb-tab" data-view="clusters" aria-pressed="false">Clusters</button>
          <button type="button" class="nb-tab" data-view="connections" aria-pressed="false">Connections</button>
          <button type="button" class="nb-tab" data-view="breakdown" aria-pressed="false">Breakdown</button>
          <button type="button" id="nbRefineButton" class="nb-ai-button" title="Use Claude to suggest titles, keywords, ideas and explanations for every note">✨ Refine with AI</button>
        </div>
        <div class="nb-search">
          <input type="text" id="nbSearchInput" placeholder="Search notes…" aria-label="Search notes" />
        </div>
      </div>

      <div class="nb-ai-bar">
        <span id="nbAiStatus" class="nb-ai-status" aria-live="polite"></span>
      </div>

      <div class="nb-layout">
        <div id="nbContent" class="nb-panel"></div>
        <aside id="nbDetail" class="nb-panel"></aside>
      </div>
    </div><!-- /notebookScreen -->
  </main>

  <script>
    "use strict";

    /*
      Every capture uses this fixed post-press delay, and captures are
      unlimited: the Capture button stays available for as many presses
      as the participant makes during the session.
    */
    const CAPTURE_DELAY_MS = 500;

    // WAI caption guidance: one or two lines, generally under 32 characters
    // per line. Japanese characters are full-width, so a Japanese line gets
    // half the character budget (roughly the same visual width; broadcast
    // subtitle practice is ~13–16 characters per line).
    const MAX_CAPTION_LINES = 2;
    const CAPTION_LAYOUTS = {
      en: { joiner: " ", maxChars: 32 },
      ja: { joiner: "", maxChars: 16 }
    };

    // Real machine translation (Chrome/Edge on-device Translator API) for
    // finalised text — natural output, but asynchronous. The lag this
    // introduces is confined to the translation pane: it never touches the
    // source-language capture/snapshot pipeline, which stays exactly as
    // synchronous and precise as before. Falls back to the local dictionary
    // below if the API is unavailable or a request fails.
    const hasTranslatorApi = typeof self !== "undefined" && "Translator" in self;

    // Fast, synchronous, zero-latency fallback/preview translator. Used for
    // (a) the whole translation pane on browsers without the Translator API,
    // and (b) a live preview of the still-changing interim text, since that
    // changes too fast to round-trip through a real translation call.
    // Unknown words simply pass through untranslated. The Japanese → English
    // direction uses the same pairs reversed.
    const TRANSLATION_DICTIONARY = {
      blue: "青い",
      triangle: "三角形",
      red: "赤い",
      circle: "円",
      square: "四角形",
      green: "緑の",
      yellow: "黄色い"
    };
    const REVERSE_TRANSLATION_DICTIONARY = Object.fromEntries(
      Object.entries(TRANSLATION_DICTIONARY).map(([en, ja]) => [ja, en])
    );
    // Longest first, so "四角形" is substituted before any shorter key inside it.
    const REVERSE_DICTIONARY_KEYS = Object.keys(REVERSE_TRANSLATION_DICTIONARY)
      .sort((a, b) => b.length - a.length);

    // Speech language modes. The recognizer, translation direction, target
    // phrase and caption layout all follow the selected mode; it can only be
    // changed between sessions (the switch is disabled while listening).
    // translatedTargetFallback is the guess used until the real translator
    // resolves the actual target-phrase translation (see
    // refreshTranslatedTargetPhrase below).
    const LANGUAGE_MODES = {
      en: {
        recognitionLang: "en-US",
        source: "en",
        target: "ja",
        targetPhrase: "blue triangle",
        translatedTargetFallback: "青い三角形",
        sourceName: "English",
        targetName: "Japanese"
      },
      ja: {
        recognitionLang: "ja-JP",
        source: "ja",
        target: "en",
        targetPhrase: "青い三角形",
        translatedTargetFallback: "blue triangle",
        sourceName: "Japanese",
        targetName: "English"
      }
    };

    const SUBTITLE_ANCHORS = [
      { id: "top", label: "highest" },
      { id: "upper", label: "upper" },
      { id: "middle", label: "centre" },
      { id: "lower", label: "lower" },
      { id: "bottom", label: "lowest" }
    ];
    const SNAPSHOT_INTERVAL_MS = 10;
    const HISTORY_RETENTION_MS = 10000;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const elements = {
      notice: document.getElementById("notice"),
      startStopButton: document.getElementById("startStopButton"),
      moveUpButton: document.getElementById("moveUpButton"),
      moveDownButton: document.getElementById("moveDownButton"),
      subtitleStage: document.getElementById("subtitleStage"),
      captionStack: document.getElementById("captionStack"),
      sourceCaptionBox: document.getElementById("sourceCaptionBox"),
      translationCaptionBox: document.getElementById("translationCaptionBox"),
      positionStatus: document.getElementById("positionStatus"),
      captureButton: document.getElementById("captureButton"),
      subtitle: document.getElementById("subtitle"),
      translation: document.getElementById("translation"),
      translatorLoading: document.getElementById("translatorLoading"),
      translatorLoadingLabel: document.getElementById("translatorLoadingLabel"),
      translatorLoadingBar: document.getElementById("translatorLoadingBar"),
      results: document.getElementById("results"),
      resultsSummary: document.getElementById("resultsSummary"),
      resultList: document.getElementById("resultList"),
      copyJsonButton: document.getElementById("copyJsonButton"),
      downloadCsvButton: document.getElementById("downloadCsvButton"),
      translationToggle: document.getElementById("translationToggle"),
      translationToggleText: document.getElementById("translationToggleText"),
      langOptions: document.querySelectorAll(".lang-option"),
      navCaptureButton: document.getElementById("navCaptureButton"),
      navNotebookButton: document.getElementById("navNotebookButton"),
      captureScreen: document.getElementById("captureScreen"),
      notebookScreen: document.getElementById("notebookScreen"),
      nbSubtitle: document.getElementById("nbSubtitle"),
      nbContent: document.getElementById("nbContent"),
      nbDetail: document.getElementById("nbDetail"),
      nbSearchInput: document.getElementById("nbSearchInput"),
      nbRefineButton: document.getElementById("nbRefineButton"),
      nbAiStatus: document.getElementById("nbAiStatus")
    };

    const state = {
      recognition: null,
      shouldListen: false,
      recognitionActive: false,
      stopRequested: false,
      finalTranscript: "",
      interimTranscript: "",
      visiblePlainText: "",
      visibleTranslatedText: "",
      translatedFinalText: "",
      translationQueue: [],
      translationQueueActive: false,
      translationGeneration: 0,
      primaryPane: "source",
      trialCount: 0,
      captures: [],
      snapshots: [],
      pendingCaptures: new Map(),
      samplingTimer: null,
      subtitleAnchorIndex: 2,
      translationEnabled: true,
      languageMode: "en",
      sessionStartPerfMs: null,
      notes: [],
      usingSampleNotes: false,
      selectedNoteId: null,
      notebookView: "list",
      notebookQuery: "",
      nbActiveBin: null
    };

    function normaliseWhitespace(text) {
      return text.replace(/\s+/g, " ").trim();
    }

    function currentMode() {
      return LANGUAGE_MODES[state.languageMode];
    }

    // Language of the text shown in a pane under the current mode.
    function paneLanguage(pane) {
      return pane === "translation" ? currentMode().target : currentMode().source;
    }

    function endsSentence(word) {
      return /[.!?。！？][\"'’”)」』]*$/.test(word);
    }

    // Japanese has no spaces between words, so caption tokens come from the
    // built-in word segmenter instead (falling back to single characters).
    // Any space the recognizer inserts is dropped, and a token longer than a
    // whole line is chunked so it can never blank the caption.
    const japaneseWordSegmenter = (typeof Intl !== "undefined" && typeof Intl.Segmenter === "function")
      ? new Intl.Segmenter("ja", { granularity: "word" })
      : null;

    function splitCaptionWords(text, lang) {
      const trimmed = normaliseWhitespace(text);
      if (!trimmed) return [];
      if (lang !== "ja") return trimmed.split(" ");

      const words = japaneseWordSegmenter
        ? [...japaneseWordSegmenter.segment(trimmed)].map((part) => part.segment).filter((word) => word.trim())
        : Array.from(trimmed.replace(/\s+/g, ""));

      const { maxChars } = CAPTION_LAYOUTS.ja;
      return words.flatMap((word) => {
        const chars = Array.from(word);
        if (chars.length <= maxChars) return [word];
        const chunks = [];
        for (let i = 0; i < chars.length; i += maxChars) {
          chunks.push(chars.slice(i, i + maxChars).join(""));
        }
        return chunks;
      });
    }

    function wrapCaptionTokens(tokens, layout) {
      const { joiner, maxChars } = layout;
      const lines = [];
      let currentLine = [];
      let currentLength = 0;

      tokens.forEach((token) => {
        const previousToken = currentLine[currentLine.length - 1];
        const sentenceBoundary = previousToken && endsSentence(previousToken.word);
        const addedLength = token.word.length + (currentLine.length > 0 ? joiner.length : 0);
        const wouldExceedLimit = currentLine.length > 0
          && currentLength + addedLength > maxChars;

        if (sentenceBoundary || wouldExceedLimit) {
          lines.push(currentLine);
          currentLine = [];
          currentLength = 0;
        }

        currentLine.push(token);
        currentLength += token.word.length + (currentLine.length > 1 ? joiner.length : 0);
      });

      if (currentLine.length > 0) {
        lines.push(currentLine);
      }

      // Avoid leaving a single short word stranded on the second line when
      // nearby words can be moved without exceeding the character limit.
      if (lines.length === 2) {
        const firstLine = [...lines[0]];
        const secondLine = [...lines[1]];
        const lineTextLength = (line) => line.map(({ word }) => word).join(joiner).length;
        const strandedLength = Math.round(maxChars * 0.375);

        while (
          firstLine.length > 1
          && secondLine.length <= 1
          && lineTextLength(secondLine) < strandedLength
        ) {
          const candidateSecondLine = [firstLine[firstLine.length - 1], ...secondLine];
          if (lineTextLength(candidateSecondLine) > maxChars) break;
          secondLine.unshift(firstLine.pop());
        }

        return [firstLine, secondLine];
      }

      return lines;
    }

    function buildCaptionLines(finalText, interimText, lang) {
      const layout = CAPTION_LAYOUTS[lang];
      const tokens = [];

      splitCaptionWords(finalText, lang).forEach((word) => {
        tokens.push({ word, interim: false });
      });

      splitCaptionWords(interimText, lang).forEach((word) => {
        tokens.push({ word, interim: true });
      });

      if (tokens.length === 0) return [];

      // Keep the longest recent suffix that can be displayed in no more than
      // two caption lines. This avoids dropping a recent target phrase merely
      // because an older line happened to wrap at an inconvenient position.
      let bestLines = [];

      for (let start = tokens.length - 1; start >= 0; start -= 1) {
        const candidateLines = wrapCaptionTokens(tokens.slice(start), layout);
        const lineLengthsValid = candidateLines.every((line) => (
          line.map(({ word }) => word).join(layout.joiner).length <= layout.maxChars
        ));

        if (candidateLines.length <= MAX_CAPTION_LINES && lineLengthsValid) {
          bestLines = candidateLines;
        } else {
          break;
        }
      }

      return bestLines;
    }

    function captionLinesToText(lines, lang) {
      const { joiner } = CAPTION_LAYOUTS[lang];
      return lines.map((line) => line.map(({ word }) => word).join(joiner)).join("\n");
    }

    // Japanese matching ignores whitespace entirely, since the recognizer
    // and translator insert spaces inconsistently and a phrase may also
    // straddle a caption line break.
    function containsPhrase(text, phrase, lang = "en") {
      const prepare = lang === "ja"
        ? (value) => value.replace(/\s+/g, "")
        : (value) => normaliseWhitespace(value).toLocaleLowerCase("en-US");
      return prepare(text).includes(prepare(phrase));
    }

    // Updated once the real translator resolves an actual translation of the
    // mode's target phrase (see refreshTranslatedTargetPhrase), so
    // target-phrase matching stays consistent with whatever the live
    // translator actually outputs instead of a hand-typed guess.
    let resolvedTranslatedTargetPhrase = LANGUAGE_MODES.en.translatedTargetFallback;

    function targetPhraseForPane(pane) {
      return pane === "translation" ? resolvedTranslatedTargetPhrase : currentMode().targetPhrase;
    }

    function containsTargetPhrase(text, pane = "source") {
      return containsPhrase(text, targetPhraseForPane(pane), paneLanguage(pane));
    }

    // Local dictionary substitution. Runs synchronously off already-computed
    // text, so it adds no delay of its own — used as the interim-text preview
    // and as the fallback when the real Translator API is unavailable or a
    // request fails. English is substituted word by word; Japanese (no
    // spaces) by replacing each known phrase wherever it occurs.
    function translateWord(word) {
      const key = word.toLocaleLowerCase("en-US").replace(/[^\p{L}\p{N}']/gu, "");
      return TRANSLATION_DICTIONARY[key] || word;
    }

    function translateWordsLocally(text) {
      if (currentMode().source === "ja") {
        let translated = normaliseWhitespace(text);
        REVERSE_DICTIONARY_KEYS.forEach((key) => {
          translated = translated.split(key).join(` ${REVERSE_TRANSLATION_DICTIONARY[key]} `);
        });
        return normaliseWhitespace(translated);
      }

      return normaliseWhitespace(text)
        .split(" ")
        .filter(Boolean)
        .map(translateWord)
        .join(" ");
    }

    function showTranslatorLoading(label, fraction) {
      elements.translatorLoading.hidden = false;
      elements.translatorLoadingLabel.textContent = label;
      if (typeof fraction === "number") {
        elements.translatorLoadingBar.style.width = `${Math.round(fraction * 100)}%`;
      }
    }

    function hideTranslatorLoadingSoon(finalLabel, delayMs = 1800) {
      elements.translatorLoadingLabel.textContent = finalLabel;
      window.setTimeout(() => {
        elements.translatorLoading.hidden = true;
        elements.translatorLoadingBar.style.width = "0%";
      }, delayMs);
    }

    // Lazily creates (once) and reuses a single Translator instance. Source
    // language tracks whatever the recognizer is configured for, so it stays
    // in sync if that's changed via config.
    //
    // Translator.create() requires an active user gesture the first time it
    // needs to download a language pack (browser policy) — an unattended
    // call (e.g. on page load) throws NotAllowedError in that case. That
    // failure is NOT cached: translatorSetupPromise is cleared so the next
    // call (ideally from a click) gets a real retry. A genuinely
    // unsupported language pair ("unavailable") IS cached, since retrying
    // that can never succeed.
    let translatorInstance = null;
    let translatorSetupPromise = null;

    function ensureTranslator() {
      if (!state.translationEnabled) return Promise.resolve(null);
      if (translatorInstance) return Promise.resolve(translatorInstance);

      if (!hasTranslatorApi) {
        console.warn("[translator] 'Translator' is not present on self — this browser doesn't expose the API. Falling back to the local dictionary.");
        return Promise.resolve(null);
      }

      if (!translatorSetupPromise) {
        translatorSetupPromise = setupTranslator();
      }

      return translatorSetupPromise;
    }

    async function setupTranslator() {
      const languageMode = state.languageMode;
      const { source: sourceLanguage, target: targetLanguage } = LANGUAGE_MODES[languageMode];
      showTranslatorLoading(`Checking ${sourceLanguage} → ${targetLanguage} translator…`);

      try {
        const availability = await Translator.availability({ sourceLanguage, targetLanguage });
        console.info(`[translator] availability for ${sourceLanguage} -> ${targetLanguage}: ${availability}`);

        if (availability === "unavailable") {
          console.warn(`[translator] ${sourceLanguage} -> ${targetLanguage} is unavailable on this device. Falling back to the local dictionary.`);
          hideTranslatorLoadingSoon(`Translator unavailable for ${sourceLanguage} → ${targetLanguage}.`);
          return null;
        }

        showTranslatorLoading(
          availability === "available" ? "Loading translator…" : "Downloading language pack…",
          0
        );

        const translator = await Translator.create({
          sourceLanguage,
          targetLanguage,
          monitor(m) {
            m.addEventListener("downloadprogress", (event) => {
              console.info(`[translator] downloading language pack: ${Math.round(event.loaded * 100)}%`);
              showTranslatorLoading("Downloading language pack…", event.loaded);
            });
          }
        });

        // The language was switched while this was loading — the switch
        // already reset the translator, so drop this now-wrong pair.
        if (languageMode !== state.languageMode) {
          translator.destroy?.();
          return null;
        }

        translatorInstance = translator;
        console.info(`[translator] ready for ${sourceLanguage} -> ${targetLanguage}`);
        hideTranslatorLoadingSoon("Translator ready.");
        return translatorInstance;
      } catch (error) {
        if (languageMode !== state.languageMode) return null;

        if (error?.name === "NotAllowedError") {
          console.warn("[translator] needs a user gesture to download the language pack — will retry on the next click (e.g. Start recognition).");
          hideTranslatorLoadingSoon("Click Start to allow the language pack download.");
          translatorSetupPromise = null;
          return null;
        }

        console.error("[translator] setup failed, falling back to the local dictionary:", error);
        hideTranslatorLoadingSoon("Translator setup failed — using local dictionary.");
        return null;
      }
    }

    // Resolved only once, on success — an unresolved attempt (e.g. blocked
    // on a gesture) is safe to call again later, it just retries via
    // ensureTranslator() above.
    let targetPhraseResolved = false;

    async function refreshTranslatedTargetPhrase() {
      if (!state.translationEnabled || targetPhraseResolved) return;

      const languageMode = state.languageMode;
      const translator = await ensureTranslator();
      if (!translator || languageMode !== state.languageMode) return;

      const { targetPhrase } = currentMode();
      try {
        const translated = await translator.translate(targetPhrase);
        if (languageMode !== state.languageMode) return;
        resolvedTranslatedTargetPhrase = normaliseWhitespace(translated);
        targetPhraseResolved = true;
        console.info(`[translator] target phrase "${targetPhrase}" -> "${resolvedTranslatedTargetPhrase}"`);
      } catch (error) {
        console.error("[translator] target-phrase translation failed, keeping fallback guess:", error);
      }
    }

    // Lightweight sentence segmentation for capture context. Uses the
    // built-in Intl.Segmenter (no external NLP library needed) when
    // available, falling back to a punctuation-based split. The source pane
    // rarely gets real punctuation from the recognizer, so its segmentation
    // is mostly by recognizer-finalised phrase boundaries; the translation
    // pane, once backed by the real Translator API, gets properly punctuated
    // output, so each pane uses the segmenter for its own language.
    const sentenceSegmenters = (typeof Intl !== "undefined" && typeof Intl.Segmenter === "function")
      ? {
          en: new Intl.Segmenter("en-US", { granularity: "sentence" }),
          ja: new Intl.Segmenter("ja", { granularity: "sentence" })
        }
      : null;

    function splitIntoSentences(text, pane = "source") {
      const trimmed = normaliseWhitespace(text);
      if (!trimmed) return [];

      if (sentenceSegmenters) {
        const segmenter = sentenceSegmenters[paneLanguage(pane)] || sentenceSegmenters.en;
        return [...segmenter.segment(trimmed)]
          .map((part) => part.segment.trim())
          .filter(Boolean);
      }

      return trimmed.split(/(?<=[.!?。！？])\s*/).filter(Boolean);
    }

    // Returns the sentence a capture landed in ("current") and the one
    // immediately before it ("previous"), from a full untruncated transcript.
    function extractSentenceContext(fullText, pane = "source") {
      const sentences = splitIntoSentences(fullText, pane);
      if (sentences.length === 0) return { current: "", previous: "" };

      return {
        current: sentences[sentences.length - 1],
        previous: sentences.length > 1 ? sentences[sentences.length - 2] : ""
      };
    }

    function getFullRunningText() {
      const finalText = normaliseWhitespace(state.finalTranscript);
      const interimText = normaliseWhitespace(state.interimTranscript);
      return normaliseWhitespace(`${finalText} ${interimText}`);
    }

    // Translation counterpart of getFullRunningText(). Never calls the real
    // (async) translator directly — it just combines whatever real
    // translation of the final text is already cached (state.translatedFinalText,
    // updated by refreshFinalTranslation) with a fast local preview of the
    // still-changing interim text. That keeps this synchronous, so recording
    // it into a snapshot never blocks on network/model latency.
    function getFullRunningTranslatedText() {
      const interimText = normaliseWhitespace(state.interimTranscript);
      const translatedInterim = translateWordsLocally(interimText);
      return normaliseWhitespace(`${state.translatedFinalText} ${translatedInterim}`);
    }

    function updateSubtitlePosition(announce = false) {
      const anchor = SUBTITLE_ANCHORS[state.subtitleAnchorIndex];
      elements.subtitleStage.dataset.anchor = anchor.id;
      elements.moveUpButton.disabled = state.subtitleAnchorIndex === 0;
      elements.moveDownButton.disabled = state.subtitleAnchorIndex === SUBTITLE_ANCHORS.length - 1;

      const positionText = `Subtitle position ${state.subtitleAnchorIndex + 1} of ${SUBTITLE_ANCHORS.length}: ${anchor.label}.`;
      elements.subtitleStage.setAttribute("aria-label", positionText);
      if (announce) {
        elements.positionStatus.textContent = positionText;
      }
    }

    function shiftSubtitle(direction) {
      const nextIndex = Math.min(
        SUBTITLE_ANCHORS.length - 1,
        Math.max(0, state.subtitleAnchorIndex + direction)
      );

      if (nextIndex === state.subtitleAnchorIndex) return;
      state.subtitleAnchorIndex = nextIndex;
      updateSubtitlePosition(true);
    }

    function setPrimaryPane(pane) {
      if (pane === state.primaryPane) return;

      state.primaryPane = pane;
      elements.captionStack.dataset.primaryPane = pane;
      elements.sourceCaptionBox.setAttribute("aria-pressed", String(pane === "source"));
      elements.translationCaptionBox.setAttribute("aria-pressed", String(pane === "translation"));
    }

    // Shows/hides the translation caption box and makes sure nothing keeps
    // treating it as selectable once it's off. Also the single place that
    // decides whether the translation pipeline (model load, network calls)
    // gets to run at all — see the guards at the top of ensureTranslator(),
    // refreshTranslatedTargetPhrase(), enqueueFinalTranslation(), and
    // renderTranslationPane().
    function applyTranslationToggle() {
      elements.translationCaptionBox.hidden = !state.translationEnabled;

      if (!state.translationEnabled) {
        if (state.primaryPane === "translation") {
          setPrimaryPane("source");
        }
        elements.translatorLoading.hidden = true;
      } else {
        refreshTranslatedTargetPhrase();
      }
    }

    elements.translationToggle.addEventListener("change", () => {
      state.translationEnabled = elements.translationToggle.checked;
      applyTranslationToggle();
    });

    // Points the recognizer, translator, target phrase and labels at the
    // selected speech language. The cached translator and its resolved
    // target phrase belong to the old language pair, so both are reset.
    function applyLanguageMode() {
      const mode = currentMode();

      elements.langOptions.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === state.languageMode));
      });
      elements.translationToggleText.textContent = `Live translation (${mode.sourceName} → ${mode.targetName})`;
      elements.subtitle.lang = mode.source;
      elements.translation.lang = mode.target;

      if (state.recognition) {
        state.recognition.lang = mode.recognitionLang;
      }

      translatorInstance?.destroy?.();
      translatorInstance = null;
      translatorSetupPromise = null;
      targetPhraseResolved = false;
      resolvedTranslatedTargetPhrase = mode.translatedTargetFallback;
    }

    // The language can only change between sessions — switching the
    // recognizer mid-session would mix two languages in one transcript.
    function syncLanguageSwitchDisabled() {
      const locked = state.shouldListen || state.recognitionActive;
      elements.langOptions.forEach((button) => {
        button.disabled = locked;
      });
    }

    elements.langOptions.forEach((button) => {
      button.addEventListener("click", () => {
        if (state.shouldListen || state.recognitionActive) return;
        if (button.dataset.lang === state.languageMode) return;

        state.languageMode = button.dataset.lang;
        applyLanguageMode();
        // Inside the click, so a first-time language pack download for the
        // new pair counts as user-initiated.
        refreshTranslatedTargetPhrase();
      });
    });

    function renderCaptionPane(targetEl, lines, listening, lang) {
      if (lines.length === 0) {
        targetEl.className = "placeholder";
        targetEl.textContent = listening ? "Listening…" : "Press “Start recognition” to begin.";
        return;
      }

      targetEl.className = "";
      targetEl.replaceChildren();
      const { joiner } = CAPTION_LAYOUTS[lang];

      lines.forEach((lineTokens) => {
        const line = document.createElement("div");
        line.className = "caption-line";

        lineTokens.forEach((token, index) => {
          const span = document.createElement("span");
          span.textContent = `${index === 0 ? "" : joiner}${token.word}`;
          if (token.interim) {
            span.className = "interim";
          }
          line.appendChild(span);
        });

        targetEl.appendChild(line);
      });
    }

    function renderTranslationPane() {
      if (!state.translationEnabled) return;
      const interimText = normaliseWhitespace(state.interimTranscript);
      const translatedInterim = translateWordsLocally(interimText);

      const lang = paneLanguage("translation");
      const translatedLines = buildCaptionLines(state.translatedFinalText, translatedInterim, lang);
      state.visibleTranslatedText = captionLinesToText(translatedLines, lang);
      renderCaptionPane(elements.translation, translatedLines, state.shouldListen, lang);
    }

    // Queues just the newly-finalised chunk for translation, rather than
    // re-translating the whole (ever-growing) cumulative transcript on every
    // final result. That growing-string approach is what made translation
    // "stop after a while" on long sessions — eventually the resend got
    // slow/large enough to fail, and every failure after that kept retrying
    // the same oversized string. Each queued chunk is small and bounded by
    // however much was said between recognizer pauses, regardless of how
    // long the session has been running.
    function enqueueFinalTranslation(newChunk) {
      if (!state.translationEnabled) return;
      const chunkText = normaliseWhitespace(newChunk);
      if (!chunkText) return;
      state.translationQueue.push(chunkText);
      processTranslationQueue();
    }

    // Processes the queue strictly one chunk at a time, in order, so
    // translated chunks are always appended in the order they were spoken —
    // translation requests can resolve out of order otherwise. This also
    // naturally throttles how fast requests hit the translator.
    async function processTranslationQueue() {
      if (state.translationQueueActive) return;
      state.translationQueueActive = true;
      const generation = state.translationGeneration;

      while (state.translationQueue.length > 0 && generation === state.translationGeneration) {
        const chunkText = state.translationQueue.shift();
        const translator = await ensureTranslator();
        if (generation !== state.translationGeneration) break;

        let translatedChunk;
        if (!translator) {
          translatedChunk = translateWordsLocally(chunkText);
        } else {
          try {
            translatedChunk = normaliseWhitespace(await translator.translate(chunkText));
          } catch (error) {
            console.error("[translator] translate() failed for a chunk, falling back to the local dictionary for it:", error);
            translatedChunk = translateWordsLocally(chunkText);
          }
          if (generation !== state.translationGeneration) break;
        }

        state.translatedFinalText = normaliseWhitespace(`${state.translatedFinalText} ${translatedChunk}`);
        renderTranslationPane();
      }

      state.translationQueueActive = false;
    }

    function renderTranscript() {
      const finalText = normaliseWhitespace(state.finalTranscript);
      const interimText = normaliseWhitespace(state.interimTranscript);

      const lang = paneLanguage("source");
      const lines = buildCaptionLines(finalText, interimText, lang);
      state.visiblePlainText = captionLinesToText(lines, lang);
      renderCaptionPane(elements.subtitle, lines, state.shouldListen, lang);

      renderTranslationPane();
    }

    function recordSnapshot(perfMs = performance.now()) {
      const previous = state.snapshots[state.snapshots.length - 1];
      if (!previous || perfMs > previous.perfMs) {
        state.snapshots.push({
          perfMs,
          text: state.visiblePlainText,
          fullText: getFullRunningText(),
          translatedText: state.visibleTranslatedText,
          translatedFullText: getFullRunningTranslatedText()
        });
      }

      const cutoff = perfMs - HISTORY_RETENTION_MS;
      while (state.snapshots.length > 1 && state.snapshots[1].perfMs < cutoff) {
        state.snapshots.shift();
      }
    }

    function findSnapshotAtOrBefore(targetPerfMs) {
      if (state.snapshots.length === 0) {
        return {
          perfMs: performance.now(),
          text: state.visiblePlainText,
          fullText: getFullRunningText(),
          translatedText: state.visibleTranslatedText,
          translatedFullText: getFullRunningTranslatedText()
        };
      }

      let low = 0;
      let high = state.snapshots.length - 1;
      let bestIndex = -1;

      while (low <= high) {
        const middle = Math.floor((low + high) / 2);
        if (state.snapshots[middle].perfMs <= targetPerfMs) {
          bestIndex = middle;
          low = middle + 1;
        } else {
          high = middle - 1;
        }
      }

      return bestIndex >= 0 ? state.snapshots[bestIndex] : state.snapshots[0];
    }

    function startSampling() {
      stopSampling();
      recordSnapshot();
      state.samplingTimer = window.setInterval(recordSnapshot, SNAPSHOT_INTERVAL_MS);
    }

    function stopSampling() {
      if (state.samplingTimer !== null) {
        window.clearInterval(state.samplingTimer);
        state.samplingTimer = null;
      }
    }

    function resetSession() {
      state.stopRequested = false;
      state.finalTranscript = "";
      state.interimTranscript = "";
      state.visiblePlainText = "";
      state.visibleTranslatedText = "";
      state.translatedFinalText = "";
      state.translationQueue = [];
      state.translationGeneration += 1;
      state.trialCount = 0;
      state.captures = [];
      state.snapshots = [];
      state.sessionStartPerfMs = null;
      state.notes = [];
      state.usingSampleNotes = false;
      state.selectedNoteId = null;
      state.nbActiveBin = null;
      // Note ids (c1, c2, ...) restart each session. An AI refinement still
      // in flight checks that state.notes is the same array it started
      // with, so its results can't land on this session's reused ids.

      state.pendingCaptures.forEach(({ timerId }) => window.clearTimeout(timerId));
      state.pendingCaptures.clear();

      setPrimaryPane("source");
      elements.results.hidden = true;
      elements.resultList.replaceChildren();
      elements.resultsSummary.textContent = "";
      elements.copyJsonButton.disabled = true;
      elements.downloadCsvButton.disabled = true;
      elements.captureButton.textContent = "Capture";
      elements.captureButton.disabled = true;
      renderTranscript();
      renderNotebook();
    }

    function brieflyConfirmCapturePress() {
      elements.captureButton.textContent = "Capture registered";
      window.setTimeout(() => {
        if (!state.shouldListen || state.stopRequested) return;
        elements.captureButton.textContent = "Capture";
      }, 350);
    }

    function completeCapture(captureId) {
      const pending = state.pendingCaptures.get(captureId);
      if (!pending) return;

      recordSnapshot();
      const adjustedSnapshot = findSnapshotAtOrBefore(pending.targetPerfMs);

      // Which pane (source or translation) was primary at button press
      // decides which stream this capture reports — fixed once, the same
      // way rawPhrase is fixed at press time, so raw and delay-adjusted
      // are always compared within the same language.
      const pane = pending.primaryPaneAtPress;
      const rawPhrase = pane === "translation" ? pending.rawTranslatedPhrase : pending.rawPhrase;
      const adjustedPhrase = pane === "translation" ? adjustedSnapshot.translatedText : adjustedSnapshot.text;
      const rawFullText = pane === "translation" ? pending.rawTranslatedFullText : pending.rawFullText;
      const adjustedFullText = pane === "translation" ? adjustedSnapshot.translatedFullText : adjustedSnapshot.fullText;

      const rawContext = extractSentenceContext(rawFullText, pane);
      const adjustedContext = extractSentenceContext(adjustedFullText, pane);

      // Labelling happens afterwards in the Notebook, so every capture is
      // scored against the mode's fixed target phrase.
      const targetPhrase = targetPhraseForPane(pane);
      const lang = paneLanguage(pane);
      const capture = {
        trial: pending.trial,
        offsetMs: pending.offsetMs,
        speechLanguage: currentMode().recognitionLang,
        pane,
        targetPhrase,
        rawPhrase,
        adjustedPhrase,
        rawContainsTarget: containsPhrase(rawPhrase, targetPhrase, lang),
        adjustedContainsTarget: containsPhrase(adjustedPhrase, targetPhrase, lang),
        snapshotErrorMs: Number((adjustedSnapshot.perfMs - pending.targetPerfMs).toFixed(3)),
        rawCurrentSentence: rawContext.current,
        rawPreviousSentence: rawContext.previous,
        adjustedCurrentSentence: adjustedContext.current,
        adjustedPreviousSentence: adjustedContext.previous
      };
      state.captures.push(capture);
      addNoteFromCapture(capture, pending);

      state.pendingCaptures.delete(captureId);

      if (state.stopRequested && state.pendingCaptures.size === 0) {
        finishStopping();
      }
    }

    function requestCapture() {
      if (!state.shouldListen || state.stopRequested) return;

      const offsetMs = CAPTURE_DELAY_MS;
      state.trialCount += 1;
      const trial = state.trialCount;
      const pressPerfMs = performance.now();
      const targetPerfMs = pressPerfMs + offsetMs;
      const captureId = `${trial}-${pressPerfMs}`;

      // Raw output is exactly what the participant could see at button press.
      const rawPhrase = state.visiblePlainText;
      const rawFullText = getFullRunningText();
      const rawTranslatedPhrase = state.visibleTranslatedText;
      const rawTranslatedFullText = getFullRunningTranslatedText();
      const primaryPaneAtPress = state.primaryPane;
      recordSnapshot(pressPerfMs);

      const timerId = window.setTimeout(() => {
        completeCapture(captureId);
      }, offsetMs + SNAPSHOT_INTERVAL_MS);

      state.pendingCaptures.set(captureId, {
        timerId,
        trial,
        offsetMs,
        pressPerfMs,
        targetPerfMs,
        rawPhrase,
        rawFullText,
        rawTranslatedPhrase,
        rawTranslatedFullText,
        primaryPaneAtPress
      });

      brieflyConfirmCapturePress();
    }

    function renderResults() {
      elements.resultList.replaceChildren();

      const orderedCaptures = [...state.captures].sort((a, b) => a.trial - b.trial);
      const rawHits = orderedCaptures.filter((capture) => capture.rawContainsTarget).length;
      const adjustedHits = orderedCaptures.filter((capture) => capture.adjustedContainsTarget).length;

      elements.copyJsonButton.disabled = orderedCaptures.length === 0;
      elements.downloadCsvButton.disabled = orderedCaptures.length === 0;

      elements.resultsSummary.textContent = orderedCaptures.length === 0
        ? `0 captures were completed.`
        : `${orderedCaptures.length} capture${orderedCaptures.length === 1 ? "" : "s"} completed at a fixed ${CAPTURE_DELAY_MS} ms delay. Each capture's target phrase (evaluated against whichever pane — source or translation — was primary at that button press) appeared in ${rawHits} raw and ${adjustedHits} delay-adjusted outputs.`;

      if (orderedCaptures.length === 0) {
        const card = document.createElement("div");
        card.className = "result-card blank";
        card.textContent = "No phrases were captured.";
        elements.resultList.appendChild(card);
      }

      orderedCaptures.forEach((capture) => {
        const card = document.createElement("article");
        card.className = "result-card";

        const paneLabel = capture.pane === "translation" ? "Translation" : "Source";

        const meta = document.createElement("div");
        meta.className = "result-meta";
        meta.textContent = `Capture ${capture.trial} · Speech: ${capture.speechLanguage} · Pane: ${paneLabel} · Assigned delay: ${capture.offsetMs} ms · Snapshot error: ${capture.snapshotErrorMs} ms`;

        const comparison = document.createElement("div");
        comparison.className = "result-comparison";

        const makeContextLine = (label, sentenceText) => {
          const line = document.createElement("p");
          line.className = "context-line";

          const labelSpan = document.createElement("span");
          labelSpan.className = "context-label";
          labelSpan.textContent = `${label}: `;

          line.append(labelSpan, document.createTextNode(sentenceText || "—"));
          return line;
        };

        const makeOutput = (heading, phrase, targetFound, sentenceContext) => {
          const output = document.createElement("section");
          output.className = "result-output";

          const title = document.createElement("h2");
          title.textContent = heading;

          const status = document.createElement("div");
          status.className = "result-status";
          status.textContent = targetFound
            ? `“${capture.targetPhrase}” present`
            : `“${capture.targetPhrase}” missing`;

          const text = document.createElement("div");
          text.className = phrase ? "result-phrase" : "result-phrase blank";
          text.textContent = phrase || "No subtitle text was visible.";

          const context = document.createElement("div");
          context.className = "result-context";
          context.append(
            makeContextLine("Previous sentence", sentenceContext.previous),
            makeContextLine("Current sentence", sentenceContext.current)
          );

          output.append(title, status, text, context);
          return output;
        };

        comparison.append(
          makeOutput(
            "Raw at button press",
            capture.rawPhrase,
            capture.rawContainsTarget,
            { previous: capture.rawPreviousSentence, current: capture.rawCurrentSentence }
          ),
          makeOutput(
            `Delay-adjusted (+${capture.offsetMs} ms)`,
            capture.adjustedPhrase,
            capture.adjustedContainsTarget,
            { previous: capture.adjustedPreviousSentence, current: capture.adjustedCurrentSentence }
          )
        );

        card.append(meta, comparison);
        elements.resultList.appendChild(card);
      });

      elements.results.hidden = false;
      elements.results.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    const CSV_COLUMNS = [
      "trial", "offsetMs", "speechLanguage", "pane", "targetPhrase",
      "rawPhrase", "adjustedPhrase",
      "rawContainsTarget", "adjustedContainsTarget",
      "snapshotErrorMs",
      "rawPreviousSentence", "rawCurrentSentence",
      "adjustedPreviousSentence", "adjustedCurrentSentence"
    ];

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function capturesToCsv(captures) {
      const rows = captures.map((capture) => (
        CSV_COLUMNS.map((column) => csvEscape(capture[column])).join(",")
      ));
      return [CSV_COLUMNS.join(","), ...rows].join("\r\n");
    }

    function brieflyConfirmButtonLabel(buttonEl, confirmText, delayMs = 1500) {
      const originalText = buttonEl.textContent;
      buttonEl.textContent = confirmText;
      buttonEl.disabled = true;
      window.setTimeout(() => {
        buttonEl.textContent = originalText;
        buttonEl.disabled = state.captures.length === 0;
      }, delayMs);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function timestampForFilename() {
      return new Date().toISOString().replace(/[:.]/g, "-");
    }

    async function copyResultsAsJson() {
      const orderedCaptures = [...state.captures].sort((a, b) => a.trial - b.trial);
      const json = JSON.stringify(orderedCaptures, null, 2);

      try {
        await navigator.clipboard.writeText(json);
        brieflyConfirmButtonLabel(elements.copyJsonButton, "Copied!");
      } catch (error) {
        console.error("[export] clipboard write failed, downloading a .json file instead:", error);
        downloadBlob(
          new Blob([json], { type: "application/json;charset=utf-8;" }),
          `capture-results-${timestampForFilename()}.json`
        );
        brieflyConfirmButtonLabel(elements.copyJsonButton, "Clipboard blocked — downloaded instead");
      }
    }

    function downloadResultsAsCsv() {
      const orderedCaptures = [...state.captures].sort((a, b) => a.trial - b.trial);
      const csv = capturesToCsv(orderedCaptures);
      const byteOrderMark = "﻿"; // Excel needs this to read the UTF-8 Japanese text correctly.
      downloadBlob(
        new Blob([byteOrderMark + csv], { type: "text/csv;charset=utf-8;" }),
        `capture-results-${timestampForFilename()}.csv`
      );
      brieflyConfirmButtonLabel(elements.downloadCsvButton, "Downloaded!");
    }

    function startRecognition() {
      if (!state.recognition || state.recognitionActive) return;

      resetSession();
      state.shouldListen = true;
      syncLanguageSwitchDisabled();
      startSampling();
      renderTranscript();

      try {
        state.recognition.start();
        elements.startStopButton.textContent = "Starting…";
        elements.startStopButton.disabled = true;
      } catch (error) {
        state.shouldListen = false;
        syncLanguageSwitchDisabled();
        stopSampling();
        elements.startStopButton.disabled = false;
        elements.startStopButton.textContent = "Start recognition";
        showNotice(`Recognition could not start: ${error.message}`);
      }
    }

    function requestStop() {
      if (!state.shouldListen && !state.recognitionActive) return;

      state.stopRequested = true;
      elements.captureButton.disabled = true;
      elements.startStopButton.disabled = true;

      if (state.pendingCaptures.size > 0) {
        elements.startStopButton.textContent = "Finishing final capture…";
      } else {
        finishStopping();
      }
    }

    function finishStopping() {
      state.shouldListen = false;
      stopSampling();

      const recognitionWasActive = Boolean(state.recognition && state.recognitionActive);
      if (recognitionWasActive) {
        state.recognition.stop();
      }

      elements.startStopButton.disabled = recognitionWasActive;
      elements.startStopButton.textContent = recognitionWasActive ? "Stopping…" : "Start new session";
      elements.captureButton.disabled = true;
      elements.captureButton.textContent = "Capture";
      renderResults();
    }

    function showNotice(message) {
      elements.notice.textContent = message;
      elements.notice.hidden = false;
    }

    function initialiseRecognition() {
      if (!SpeechRecognition) {
        showNotice("Speech recognition is unavailable in this browser. Use a current version of Chrome or Edge.");
        elements.startStopButton.disabled = true;
        return;
      }

      state.recognition = new SpeechRecognition();
      state.recognition.continuous = true;
      state.recognition.interimResults = true;
      state.recognition.maxAlternatives = 1;
      state.recognition.lang = currentMode().recognitionLang;

      state.recognition.onstart = () => {
        state.recognitionActive = true;
        if (state.sessionStartPerfMs === null) {
          state.sessionStartPerfMs = performance.now();
        }
        elements.notice.hidden = true;
        elements.startStopButton.disabled = false;
        elements.startStopButton.textContent = "Stop and show results";
        elements.captureButton.disabled = false;
        elements.captureButton.textContent = "Capture";
      };

      state.recognition.onresult = (event) => {
        let interim = "";
        let newFinalChunk = "";

        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const result = event.results[i];
          const transcript = result[0]?.transcript ?? "";

          if (result.isFinal) {
            state.finalTranscript += `${transcript} `;
            newFinalChunk += `${transcript} `;
          } else {
            interim += transcript;
          }
        }

        state.interimTranscript = interim;
        renderTranscript();
        recordSnapshot();

        if (newFinalChunk) {
          enqueueFinalTranslation(newFinalChunk);
        }
      };

      state.recognition.onerror = (event) => {
        const messages = {
          "not-allowed": "Microphone permission was denied.",
          "service-not-allowed": "The speech-recognition service is not allowed.",
          "audio-capture": "No usable microphone was found.",
          "network": "The speech-recognition service reported a network error.",
          "no-speech": "No speech was detected.",
          "aborted": "Recognition was stopped."
        };

        if (event.error !== "no-speech" && event.error !== "aborted") {
          showNotice(messages[event.error] || `Recognition error: ${event.error}`);
        }

        if (["not-allowed", "service-not-allowed", "audio-capture"].includes(event.error)) {
          state.shouldListen = false;
          syncLanguageSwitchDisabled();
          stopSampling();
          elements.startStopButton.disabled = false;
          elements.startStopButton.textContent = "Start recognition";
          elements.captureButton.disabled = true;
        }
      };

      state.recognition.onend = () => {
        state.recognitionActive = false;
        syncLanguageSwitchDisabled();

        if (state.shouldListen && !state.stopRequested) {
          window.setTimeout(() => {
            if (!state.shouldListen || state.recognitionActive || state.stopRequested) return;
            try {
              state.recognition.start();
            } catch (error) {
              showNotice(`Recognition could not restart: ${error.message}`);
            }
          }, 200);
          return;
        }

        if (!state.shouldListen) {
          elements.startStopButton.disabled = false;
          elements.startStopButton.textContent = state.stopRequested ? "Start new session" : "Start recognition";
        }
      };
    }

    elements.startStopButton.addEventListener("click", () => {
      if (state.shouldListen || state.recognitionActive) {
        requestStop();
      } else {
        // Translator.create() needs a user gesture to prompt a model
        // download the first time — calling it here, directly inside the
        // click handler, is what makes that gesture count.
        refreshTranslatedTargetPhrase();
        startRecognition();
      }
    });

    elements.moveUpButton.addEventListener("click", () => shiftSubtitle(-1));
    elements.moveDownButton.addEventListener("click", () => shiftSubtitle(1));
    elements.captureButton.addEventListener("click", requestCapture);

    elements.sourceCaptionBox.addEventListener("click", () => setPrimaryPane("source"));
    elements.translationCaptionBox.addEventListener("click", () => setPrimaryPane("translation"));

    elements.copyJsonButton.addEventListener("click", copyResultsAsJson);
    elements.downloadCsvButton.addEventListener("click", downloadResultsAsCsv);

    window.addEventListener("beforeunload", () => {
      stopSampling();
      state.pendingCaptures.forEach(({ timerId }) => window.clearTimeout(timerId));
      if (state.recognitionActive && state.recognition) {
        state.recognition.abort();
      }
    });

    if (!window.isSecureContext) {
      showNotice("Microphone access may fail when this file is opened directly. Run it through localhost in Chrome or Edge if necessary.");
    }

    updateSubtitlePosition();
    applyLanguageMode();
    applyTranslationToggle();
    resetSession();
    initialiseRecognition();

    // Try loading the translator immediately on launch. This only actually
    // succeeds without further interaction if the language pack was already
    // downloaded in an earlier session (no gesture needed for an already-
    // available model) — a first-time download still requires a click, per
    // browser policy, so the Start-button handler above retries this too.
    refreshTranslatedTargetPhrase();

    /* =====================================================================
       NOTEBOOK
       Captures feed directly into state.notes the moment completeCapture()
       runs — no export/import step. Connections, clusters, and prerequisites
       are computed from shared keywords, not hand-tagged. The "Ask AI to
       define" feature is the one part that costs anything: it's entirely
       opt-in (nothing fires until clicked) and needs your own Anthropic API
       key, kept only in this browser's localStorage — never written into
       this file, so the file itself is safe to share even after you've used
       the AI feature locally.
    ===================================================================== */

    const NB_STOPWORDS = new Set([
      "the", "and", "for", "with", "that", "this", "you", "your", "there", "their", "them",
      "then", "than", "these", "those", "were", "was", "have", "has", "had", "not", "but",
      "just", "really", "very", "like", "think", "going", "gonna", "get", "got", "one", "two",
      "also", "because", "what", "which", "who", "how", "does", "did", "can", "could", "would",
      "should", "will", "about", "all", "some", "more", "most", "much", "many", "even", "only",
      "out", "back", "here", "okay", "yeah", "from", "into", "every", "next", "part", "things",
      "make", "makes", "made", "need", "needs", "want", "wants", "says", "said", "concept",
      "concepts", "itself", "themselves", "yourself"
    ]);

    function nbTokenize(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean)
        .map((w) => (w.length > 4 ? w.replace(/s$/, "") : w))
        .filter((w) => w.length >= 4 && !NB_STOPWORDS.has(w));
    }

    // Everything written on a note — title, transcript, and the user's own
    // annotations at every depth — so annotations feed keywords, search,
    // clusters and connections just like the captured text does. Field
    // names ("Example", "Keyword", …) are only searchable, never keywords:
    // otherwise every two notes with an "Example" field would look related.
    function nbAnnotationText(annotations, includeLabels = true) {
      return (annotations || [])
        .map((a) => `${includeLabels ? a.label : ""} ${a.text} ${nbAnnotationText(a.children, includeLabels)}`)
        .join(" ");
    }

    function nbNoteText(note, includeLabels = true) {
      return `${note.concept} ${note.phrase} ${nbAnnotationText(note.annotations, includeLabels)}`;
    }

    // User keywords: the text of any annotation named "Keyword(s)" or
    // "Tag(s)", at any depth, split on commas/semicolons/new lines so one
    // field can hold several. Matched as whole phrases, case-insensitively,
