      // The log belongs to the notebook, so it's replaced by the file's.
      // This visit's events so far carry over only if no real notebook was
      // open yet (just the sample notes) — otherwise they belong to the
      // notebook being replaced.
      state.interactionLog = [...log, ...(state.usingSampleNotes ? state.interactionLog : [])];
      // A new array, so an AI refinement still in flight for the previous
      // notebook sees the swap and drops its results.
      state.notes = notes;
      state.usingSampleNotes = false;
      state.selectedNoteId = notes[0]?.id ?? null;
      state.nbActiveBin = null;
      state.nbSavedJson = JSON.stringify(notes);
      logEvent("notebook_opened", { fileName: file.name, notes: notes.length, priorLogEvents: log.length });
      renderNotebook();
      nbSetAiStatus(`Opened ${file.name} — ${notes.length} note${notes.length === 1 ? "" : "s"}. New captures will be added to this notebook.`);
    }

    elements.nbDownloadButton.addEventListener("click", nbDownloadNotebook);

    elements.nbOpenButton.addEventListener("click", () => {
      if (state.shouldListen || state.recognitionActive) {
        nbSetAiStatus("Stop recognition before opening a notebook.", true);
        return;
      }
      if (nbHasUnsavedChanges()
        && !window.confirm("Opening a notebook replaces the current notes, which haven't been downloaded since your last change. Continue?")) {
        return;
      }
      elements.nbOpenInput.click();
    });

    elements.nbOpenInput.addEventListener("change", () => {
      const file = elements.nbOpenInput.files[0];
      // Cleared so choosing the same file again still fires "change".
      elements.nbOpenInput.value = "";
      if (file) nbOpenNotebookFile(file);
    });

    window.addEventListener("beforeunload", (event) => {
      if (!nbHasUnsavedChanges()) return;
      event.preventDefault();
      event.returnValue = "";
    });

    elements.navCaptureButton.addEventListener("click", () => {
      if (!elements.captureScreen.hidden) return;
      elements.captureScreen.hidden = false;
      elements.notebookScreen.hidden = true;
      elements.navCaptureButton.setAttribute("aria-pressed", "true");
      elements.navNotebookButton.setAttribute("aria-pressed", "false");
      logEvent("screen_changed", { to: "capture" });
    });

    elements.navNotebookButton.addEventListener("click", () => {
      if (!elements.notebookScreen.hidden) return;
      elements.captureScreen.hidden = true;
      elements.notebookScreen.hidden = false;
      elements.navCaptureButton.setAttribute("aria-pressed", "false");
      elements.navNotebookButton.setAttribute("aria-pressed", "true");
      logEvent("screen_changed", { to: "notebook", notes: state.notes.length, sampleNotes: state.usingSampleNotes });
      renderNotebook();
    });

    document.getElementById("nbTabs").addEventListener("click", (event) => {
      const btn = event.target.closest(".nb-tab");
      if (!btn) return;
      if (btn.dataset.view !== state.notebookView) {
        logEvent("notebook_view_changed", { from: state.notebookView, to: btn.dataset.view });
      }
      state.notebookView = btn.dataset.view;
      state.nbActiveBin = null;
      document.querySelectorAll(".nb-tab").forEach((el) => el.setAttribute("aria-pressed", String(el === btn)));
      renderNotebook();
    });

    // Search is logged once typing pauses, not per keystroke.
    let nbSearchLogTimer = null;
    elements.nbSearchInput.addEventListener("input", (event) => {
      state.notebookQuery = event.target.value;
      renderNotebook();
      window.clearTimeout(nbSearchLogTimer);
      nbSearchLogTimer = window.setTimeout(() => {
        logEvent("notebook_searched", {
          query: state.notebookQuery,
          matches: state.notes.filter((n) => nbMatches(n, state.notebookQuery)).length
        });
      }, 800);
    });

    // Time away from the app (switching tabs/windows) matters for reading
    // engagement and capture timing.
    document.addEventListener("visibilitychange", () => {
      logEvent(document.hidden ? "page_hidden" : "page_visible");
    });

    logEvent("app_loaded", {
      userAgent: navigator.userAgent,
      language: navigator.language,
      viewport: { width: window.innerWidth, height: window.innerHeight },
      speechRecognitionSupported: Boolean(SpeechRecognition),
      translatorApiSupported: "Translator" in window,
      secureContext: window.isSecureContext,
      host: window.location.hostname
    });

    renderNotebook();
    nbSetAiStatus(`Refine uses Claude Haiku · ${nbRefinesLeftText()}.`);
    nbLoadLocalConfig().then(() => {
      if (nbUnlimitedRefines()) nbSetAiStatus(`Refine uses Claude Haiku · ${nbRefinesLeftText()}.`);
    });
  </script>
</body>
</html>
